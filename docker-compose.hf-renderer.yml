# HyperFrames MP4 Renderer — production service
# Build: docker build -t paradigm-hf-renderer -f docker/Dockerfile.hf-renderer .

services:
  hf-renderer:
    image: paradigm-hf-renderer:0.6.88
    container_name: paradigm-hf-renderer
    restart: unless-stopped
    volumes:
      - hf-renders:/app/renders
    environment:
      - NODE_ENV=production
      - HYPERFRAMES_API_KEY=${HYPERFRAMES_API_KEY:-hf-oss-20260609-key}
      - HYPERFRAMES_MAX_CONCURRENCY=2
      - PORT=3001
    command: >
      sh -c "hyperframes serve --port 3001"
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hyperframes.entryPoints=https"
      - "traefik.http.routers.hyperframes.rule=Host(`hyperframes.paradigmjp.com`)"
      - "traefik.http.routers.hyperframes.tls=true"
      - "traefik.http.services.hyperframes.loadbalancer.server.port=3001"

networks:
  coolify:
    external: true

volumes:
  hf-renders:
