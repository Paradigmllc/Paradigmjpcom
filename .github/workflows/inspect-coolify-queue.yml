name: Inspect Coolify Deployment Queue

on:
  pull_request:
    paths:
      - .github/workflows/inspect-coolify-queue.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_API_URL: https://coolify.paradigmjp.com
      PARADIGM_APP_UUID: n8i2sjiqvr2d8hrzppop2m2i
    steps:
      - uses: actions/checkout@v4
      - name: Capture sanitized queue state
        run: |
          set -euo pipefail
          API="${COOLIFY_API_URL%/}/api/v1"
          get() {
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              --header "Accept: application/json" \
              "$1"
          }
          get "${API}/deployments" > /tmp/deployments.raw.json
          get "${API}/deployments/applications/${PARADIGM_APP_UUID}?skip=0&take=20" > /tmp/history.raw.json
          get "${API}/applications/${PARADIGM_APP_UUID}" > /tmp/application.raw.json
          jq '[.[]? | {id,deployment_uuid,status,commit,created_at,updated_at,started_at,finished_at,horizon_job_id,horizon_job_worker,current_process_id,application_id:(.application.id // .application_id // null),application_uuid:(.application.uuid // .application_uuid // .resource_uuid // null),application_name:(.application.name // null)}]' /tmp/deployments.raw.json > /tmp/coolify-all-deployments.json
          jq --arg app "${PARADIGM_APP_UUID}" '[.[]? | select((.application.uuid // .application_uuid // .resource_uuid // "") == $app or ((.application.id // .application_id // 0) == 2)) | {id,deployment_uuid,status,commit,created_at,updated_at,started_at,finished_at,horizon_job_id,horizon_job_worker,current_process_id,application:{id:.application.id,uuid:.application.uuid,name:.application.name,status:.application.status}}]' /tmp/deployments.raw.json > /tmp/coolify-queue.json
          jq '[.deployments[]? | {id,deployment_uuid,status,commit,created_at,updated_at,started_at,finished_at,horizon_job_id,horizon_job_worker,current_process_id,server_id,application_id}]' /tmp/history.raw.json > /tmp/coolify-history.json
          jq '{id,uuid,name,status,git_commit_sha,updated_at,server_status:(.destination.server.status // null),server_usable:(.destination.server.settings.is_usable // null)}' /tmp/application.raw.json > /tmp/coolify-application.json
          cat /tmp/coolify-all-deployments.json
          cat /tmp/coolify-queue.json
          cat /tmp/coolify-history.json
          cat /tmp/coolify-application.json
      - name: Upload sanitized inspection
        uses: actions/upload-artifact@v4
        with:
          name: coolify-queue-inspection
          path: |
            /tmp/coolify-all-deployments.json
            /tmp/coolify-queue.json
            /tmp/coolify-history.json
            /tmp/coolify-application.json
          retention-days: 1
