name: Media OS Source Snapshot

on:
  pull_request:
    paths:
      - .github/workflows/media-os-source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create repository bundle
        run: git bundle create /tmp/paradigmjpcom.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: paradigmjpcom-source-bundle
          path: /tmp/paradigmjpcom.bundle
          retention-days: 1
