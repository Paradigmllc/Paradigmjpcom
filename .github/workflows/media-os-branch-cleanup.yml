name: Media OS Branch Cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: media-os-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.head_ref == 'codex/japan-market-media-os'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove transfer probes and make merge protection-safe
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/media-os-transfer-probe.txt .github/push-files-schema-probe.txt
          if [ -f .github/workflows/media-os-final-gate.yml ]; then
            python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/media-os-final-gate.yml')
          text = path.read_text()
          text = text.replace(
              'gh pr merge "$PR_URL" --squash --delete-branch',
              'gh pr merge "$PR_URL" --auto --squash --delete-branch',
          )
          path.write_text(text)
          PY
          fi
          rm -f .github/workflows/media-os-branch-cleanup.yml
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: remove temporary Media OS transfer files'
          git push origin HEAD:${{ github.head_ref }}
