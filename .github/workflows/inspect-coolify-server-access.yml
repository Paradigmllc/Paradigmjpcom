name: Inspect Coolify Server Access

on:
  pull_request:
    paths:
      - .github/workflows/inspect-coolify-server-access.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_API_URL: https://coolify.paradigmjp.com
      PARADIGM_APP_UUID: n8i2sjiqvr2d8hrzppop2m2i
    steps:
      - uses: actions/checkout@v4
      - name: Capture non-secret server and key metadata
        run: |
          set -euo pipefail
          API="${COOLIFY_API_URL%/}/api/v1"
          auth=(-H "Authorization: Bearer ${COOLIFY_API_TOKEN}" -H 'Accept: application/json')
          curl --fail-with-body --silent --show-error "${auth[@]}" "${API}/servers" > /tmp/servers.raw.json
          curl --fail-with-body --silent --show-error "${auth[@]}" "${API}/security/keys" > /tmp/keys.raw.json
          curl --fail-with-body --silent --show-error "${auth[@]}" "${API}/applications/${PARADIGM_APP_UUID}" > /tmp/app.raw.json
          jq '[.[]? | {id,uuid,name,ip,port,user,team_id,private_key_id,status,unreachable_count}]' /tmp/servers.raw.json > /tmp/servers.json
          jq '[.[]? | {id,uuid,name,team_id,is_git_related,created_at,updated_at}]' /tmp/keys.raw.json > /tmp/keys.json
          jq '{uuid,name,status,private_key_id,destination:{uuid:.destination.uuid,network:.destination.network,server:{id:.destination.server.id,uuid:.destination.server.uuid,name:.destination.server.name,ip:.destination.server.ip,port:.destination.server.port,user:.destination.server.user,private_key_id:.destination.server.private_key_id,team_id:.destination.server.team_id,status:.destination.server.status}}}' /tmp/app.raw.json > /tmp/app.json
          cat /tmp/servers.json
          cat /tmp/keys.json
          cat /tmp/app.json
      - name: Upload sanitized metadata
        uses: actions/upload-artifact@v4
        with:
          name: coolify-server-access-metadata
          path: |
            /tmp/servers.json
            /tmp/keys.json
            /tmp/app.json
          retention-days: 1
