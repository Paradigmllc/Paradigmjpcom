name: Discover Video Factory Coolify Target

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/video-factory-target-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_API_URL: https://coolify.paradigmjp.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      MAIN_APP_UUID: n8i2sjiqvr2d8hrzppop2m2i
    steps:
      - name: Print non-sensitive target metadata
        run: |
          set -euo pipefail
          API="${COOLIFY_API_URL%/}/api/v1"
          get() {
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              --header "Accept: application/json" \
              "${API}$1"
          }

          apps="$(get /applications)"
          servers="$(get /servers)"
          team="$(get /teams/current)"
          teams="$(get /teams)"
          projects="$(get /projects)"
          keys="$(get /security/keys)"

          echo "current-team:"
          printf '%s' "${team}" | jq '{id,uuid,name,description}'
          echo "user-teams:"
          printf '%s' "${teams}" | jq '[.[] | {id,uuid,name,description,personal_team}]'
          echo "projects:"
          printf '%s' "${projects}" | jq '[.[] | {uuid,name,description}]'
          echo "security-keys:"
          printf '%s' "${keys}" | jq '[.[] | {uuid,name,description,is_git_related}]'
          echo "main-application-target:"
          printf '%s' "${apps}" | jq --arg uuid "${MAIN_APP_UUID}" '
            [.[] | select(.uuid == $uuid)][0]
            | {
                uuid,
                name,
                environment_id,
                destination_id,
                destination_type,
                destination: (
                  if .destination then {
                    uuid: .destination.uuid,
                    name: .destination.name,
                    network: .destination.network,
                    server: (
                      if .destination.server then {
                        uuid: .destination.server.uuid,
                        name: .destination.server.name,
                        ip: .destination.server.ip,
                        user: .destination.server.user,
                        port: .destination.server.port,
                        team_id: .destination.server.team_id,
                        private_key_id: .destination.server.private_key_id,
                        is_build_server: .destination.server.is_build_server,
                        unreachable: .destination.server.unreachable
                      } else null end
                    )
                  } else null end
                )
              }
          '
          echo "team-visible-servers:"
          printf '%s' "${servers}" | jq '[.[] | {uuid,name,ip,user,port,team_id,private_key_id,is_build_server,unreachable}]'
