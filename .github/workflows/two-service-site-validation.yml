name: Two-service site validation

on:
  pull_request:
    paths:
      - "next.config.ts"
      - "src/app/[locale]/home-v2/page.tsx"
      - "src/app/[locale]/japan-market-partner/page.tsx"
      - "src/app/[locale]/video-as-a-service/**"
      - "src/app/[locale]/contact/**"
      - "src/app/api/contact/**"
      - "src/app/sitemap.ts"
      - "src/lib/video-service-*.ts"
      - "src/components/aesop/SiteHeader.tsx"
      - "src/components/aesop/SiteFooter.tsx"
      - "docs/knowledge/video-as-a-service-operating-system.md"
      - "docs/templates/video-service-*.md"
      - ".github/workflows/two-service-site-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: two-service-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Contact payload tests
        run: >-
          npm exec -- vitest run
          src/app/api/contact/contact-payload.test.ts
          src/app/api/contact/contact-payload.video-service.test.ts

      - name: TypeScript
        run: |
          set -o pipefail
          npm exec -- tsc --noEmit 2>&1 | tee /tmp/typescript.log

      - name: Lint changed implementation
        run: |
          set -o pipefail
          npm exec -- eslint \
            next.config.ts \
            'src/app/[locale]/home-v2/page.tsx' \
            'src/app/[locale]/japan-market-partner/page.tsx' \
            'src/app/[locale]/video-as-a-service' \
            'src/app/[locale]/contact' \
            src/app/api/contact \
            src/app/sitemap.ts \
            src/lib/video-service-content.ts \
            src/lib/video-service-terms.ts \
            src/components/aesop/SiteHeader.tsx \
            src/components/aesop/SiteFooter.tsx \
            --max-warnings=0 \
            2>&1 | tee /tmp/eslint.log

      - name: Production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      - name: Upload validation logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: two-service-validation-logs
          path: |
            /tmp/typescript.log
            /tmp/eslint.log
            /tmp/build.log
          if-no-files-found: warn
          retention-days: 7
