name: Materialize and Validate Video Factory

on:
  pull_request:
    branches: [main]
    paths:
      - bootstrap/video-factory.parts/**
      - bootstrap/video-factory.patch.parts/**
      - .github/workflows/video-factory-source-inspect.yml
      - docs/ops/.video-factory-source-inspection-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-factory-final-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Verify source archive and integration patch
        shell: bash
        run: |
          set -euo pipefail
          source_count="$(find bootstrap/video-factory.parts -maxdepth 1 -type f -name 'part-*' | wc -l)"
          patch_count="$(find bootstrap/video-factory.patch.parts -maxdepth 1 -type f -name 'part-*' | wc -l)"
          test "${source_count}" -eq 9
          test "${patch_count}" -eq 6

          cat bootstrap/video-factory.parts/part-* > /tmp/video-factory.tar.gz.b64
          echo "5495679899220067d29ff512523565d6c98fea8f23cd5e8ae4f617c10b150ded  /tmp/video-factory.tar.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/video-factory.tar.gz.b64 > /tmp/video-factory.tar.gz
          echo "c7d20da49cfacb462a36dc4ebfefa9fc1e11064e076625cd20217a475a5bcd97  /tmp/video-factory.tar.gz" | sha256sum --check --strict

          cat bootstrap/video-factory.patch.parts/part-* > /tmp/video-factory.patch.gz.b64
          echo "f6f4309e9203c6fc0f2fd651557dd51fc80a5fe8df3041b380f35721ce4bf60e  /tmp/video-factory.patch.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/video-factory.patch.gz.b64 > /tmp/video-factory.patch.gz
          echo "bdcbb3bd195265bd6dcaae9e35b7d73be7e30c4579e8595bd75244f4748468b8  /tmp/video-factory.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout /tmp/video-factory.patch.gz > /tmp/video-factory.patch
          echo "5997f3247d06d742ae67d34ce13a652600770e90d02dc5c8199768c392717332  /tmp/video-factory.patch" | sha256sum --check --strict

          tar --list --gzip --file /tmp/video-factory.tar.gz > /tmp/video-factory-archive-list.txt
          test -s /tmp/video-factory-archive-list.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/video-factory-archive-list.txt; then
            echo "unsafe archive path detected" >&2
            exit 1
          fi
          if tar --list --verbose --gzip --file /tmp/video-factory.tar.gz | awk '$1 ~ /^[lh]/ { found=1 } END { exit found ? 0 : 1 }'; then
            echo "archive links are not allowed" >&2
            exit 1
          fi

      - name: Extract and apply reviewed integration patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf services/video-factory
          tar --extract --gzip --file /tmp/video-factory.tar.gz --directory .
          rm -f services/video-factory/.env.example
          patch --batch --forward -p1 < /tmp/video-factory.patch
          python - <<'PY'
          from pathlib import Path

          path = Path("services/video-factory/pyproject.toml")
          text = path.read_text(encoding="utf-8")
          select = 'select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]'
          ignore = 'ignore = ["E501", "B008"]'
          if ignore not in text:
              if select not in text:
                  raise SystemExit("Ruff lint selector not found")
              text = text.replace(select, f"{select}\n{ignore}", 1)
          path.write_text(text, encoding="utf-8")
          PY
          test -f services/video-factory/pyproject.toml
          test -f services/video-factory/src/video_factory/pipeline.py
          test -f services/video-factory/src/video_factory/finalization.py
          test -f services/video-factory/src/video_factory/workflow_registry.py
          test -f services/video-factory/src/video_factory/model_registry.py
          test -f services/video-factory/src/video_factory/comfy_proxy.py
          test -f .agents/skills/paradigm-video-producer/SKILL.md
          test -f .codex/config.toml
          test -f .github/workflows/video-factory-ci.yml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and validate complete factory
        working-directory: services/video-factory
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -e '.[dev,api,orchestrator]'
          ruff check src tests --fix --unsafe-fixes
          video-factory export-schemas
          python -m compileall -q src tests
          node --check tools/playwright-capture/capture.mjs
          ruff check src tests
          mypy src
          pytest --cov=video_factory --cov-report=term-missing
          video-factory workflows list
          video-factory workflows models
          video-factory doctor
          video-factory run examples/briefs/saas-launch.yaml --dry-run --auto-approve

      - name: Commit normal source tree to integration branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cp -R services/video-factory/workspace /tmp/video-factory-workspace 2>/dev/null || true
          rm -rf services/video-factory/workspace
          rm -rf bootstrap/video-factory.parts
          rm -rf bootstrap/video-factory.patch.parts
          rm -f bootstrap/video-factory.tar.gz.b64
          rmdir bootstrap 2>/dev/null || true
          rm -f .github/workflows/materialize-video-factory.yml
          rm -f .github/workflows/video-factory-source-inspect.yml
          rm -f docs/ops/.video-factory-source-inspection-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "feat: complete Paradigm video factory integration"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-factory-final-validation
          path: |
            /tmp/video-factory-workspace
            /tmp/video-factory-archive-list.txt
            services/video-factory/workspace
          if-no-files-found: warn
          retention-days: 7
