name: Materialize Video Factory Integration Branch

on:
  push:
    branches:
      - agent/video-factory-source-inspect
    paths:
      - .github/workflows/video-factory-source-inspect.yml
      - docs/ops/.video-factory-source-inspection-trigger

permissions:
  contents: write

concurrency:
  group: video-factory-integration-materialization
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/video-factory-source-inspect
          fetch-depth: 0

      - name: Verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          part_count="$(find bootstrap/video-factory.parts -maxdepth 1 -type f -name 'part-*' | wc -l)"
          test "${part_count}" -eq 9
          cat bootstrap/video-factory.parts/part-* > /tmp/video-factory.tar.gz.b64
          echo "5495679899220067d29ff512523565d6c98fea8f23cd5e8ae4f617c10b150ded  /tmp/video-factory.tar.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/video-factory.tar.gz.b64 > /tmp/video-factory.tar.gz
          echo "c7d20da49cfacb462a36dc4ebfefa9fc1e11064e076625cd20217a475a5bcd97  /tmp/video-factory.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/video-factory.tar.gz --directory .
          test -f services/video-factory/pyproject.toml
          test -f services/video-factory/src/video_factory/pipeline.py
          test -f .github/workflows/video-factory-ci.yml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize and validate source
        working-directory: services/video-factory
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -e '.[dev,api,orchestrator]'

          python - <<'PY'
          from pathlib import Path

          media = Path("src/video_factory/media.py")
          media_lines = media.read_text(encoding="utf-8").splitlines()
          replacement_line = r'        "".join(f"file {path.as_posix()!r}\n" for path in normalized),'
          matches = 0
          for index, line in enumerate(media_lines):
              if "path.as_posix().replace" in line and "for path in normalized" in line:
                  media_lines[index] = replacement_line
                  matches += 1
          if matches != 1:
              raise SystemExit(f"expected one ffconcat path expression, found {matches}")
          media.write_text("\n".join(media_lines) + "\n", encoding="utf-8")

          cli = Path("src/video_factory/cli.py")
          cli_lines = cli.read_text(encoding="utf-8").splitlines()
          matches = 0
          for index, line in enumerate(cli_lines):
              if line.strip() == "output: Path | None = typer.Option(None),":
                  cli_lines[index] = f"{line}  # noqa: B008"
                  matches += 1
              elif line.strip() == "output: Path | None = typer.Option(None),  # noqa: B008":
                  matches += 1
          if matches != 1:
              raise SystemExit(f"expected one Typer output option signature, found {matches}")
          cli.write_text("\n".join(cli_lines) + "\n", encoding="utf-8")

          playwright = Path("src/video_factory/adapters/playwright.py")
          playwright_lines = playwright.read_text(encoding="utf-8").splitlines()
          matches = 0
          index = 0
          while index < len(playwright_lines) - 2:
              if (
                  playwright_lines[index].strip()
                  == "if context.settings.playwright_allowed_hosts:"
                  and playwright_lines[index + 1].strip().startswith(
                      'if (parsed.hostname or "").lower() not in '
                  )
                  and playwright_lines[index + 2].strip().startswith(
                      'raise ValueError(f"Playwright host is not allow-listed:'
                  )
              ):
                  indent = playwright_lines[index][
                      : len(playwright_lines[index]) - len(playwright_lines[index].lstrip())
                  ]
                  playwright_lines[index : index + 3] = [
                      f"{indent}if (",
                      f"{indent}    context.settings.playwright_allowed_hosts",
                      f"{indent}    and (parsed.hostname or \"\").lower()",
                      f"{indent}    not in context.settings.playwright_allowed_hosts",
                      f"{indent}):",
                      f"{indent}    raise ValueError(",
                      f"{indent}        f\"Playwright host is not allow-listed: {{parsed.hostname}}\"",
                      f"{indent}    )",
                  ]
                  matches += 1
                  index += 8
              else:
                  index += 1
          if matches != 1:
              raise SystemExit(f"expected one Playwright allow-list guard, found {matches}")
          playwright.write_text("\n".join(playwright_lines) + "\n", encoding="utf-8")

          validation = Path("src/video_factory/validation.py")
          validation_lines = validation.read_text(encoding="utf-8").splitlines()
          guards = {
              "if ShotKind.PORTRAIT_ANIMATION in brief.requested_shot_kinds:": (
                  "if brief.rights.likeness_consent is not LikenessConsent.GRANTED:",
                  "ShotKind.PORTRAIT_ANIMATION in brief.requested_shot_kinds",
                  "brief.rights.likeness_consent is not LikenessConsent.GRANTED",
              ),
              "if ShotKind.LIP_SYNC in brief.requested_shot_kinds:": (
                  "if brief.rights.voice_consent is not LikenessConsent.GRANTED:",
                  "ShotKind.LIP_SYNC in brief.requested_shot_kinds",
                  "brief.rights.voice_consent is not LikenessConsent.GRANTED",
              ),
          }
          matches = 0
          index = 0
          while index < len(validation_lines) - 1:
              first = validation_lines[index].strip()
              second = validation_lines[index + 1].strip()
              if first in guards and second == guards[first][0]:
                  indent = validation_lines[index][
                      : len(validation_lines[index]) - len(validation_lines[index].lstrip())
                  ]
                  condition_one, condition_two = guards[first][1:]
                  validation_lines[index : index + 2] = [
                      f"{indent}if (",
                      f"{indent}    {condition_one}",
                      f"{indent}    and {condition_two}",
                      f"{indent}):",
                  ]
                  matches += 1
                  index += 4
              else:
                  index += 1
          if matches != 2:
              raise SystemExit(f"expected two consent guards, found {matches}")
          validation.write_text("\n".join(validation_lines) + "\n", encoding="utf-8")
          PY

          ruff check src tests --fix --unsafe-fixes
          video-factory export-schemas
          python -m compileall -q src tests
          node --check tools/playwright-capture/capture.mjs
          pytest --cov=video_factory --cov-report=term-missing
          ruff check src tests
          mypy src
          video-factory run examples/briefs/saas-launch.yaml --dry-run --auto-approve

      - name: Commit normal source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf services/video-factory/workspace
          rm -rf bootstrap/video-factory.parts
          rm -f bootstrap/video-factory.tar.gz.b64
          rmdir bootstrap 2>/dev/null || true
          rm -f .github/workflows/materialize-video-factory.yml
          rm -f .github/workflows/video-factory-source-inspect.yml
          rm -f docs/ops/.video-factory-source-inspection-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "feat: materialize Paradigm video factory source"
          git push origin HEAD:agent/video-factory-source-inspect

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-factory-integration-materialization
          path: |
            services/video-factory/workspace
          if-no-files-found: warn
          retention-days: 1
