name: One-shot Two-Service Route Recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-country-partner-release.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: paradigmjp-production-release
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_API_URL: https://coolify.paradigmjp.com
      PARADIGM_APP_UUID: n8i2sjiqvr2d8hrzppop2m2i
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Report recovery start
        run: |
          gh issue comment 569 --repo "$GITHUB_REPOSITORY" --body "Fast production route recovery started from \`$(git rev-parse HEAD)\`. The application image is already built; this run only reconnects the live route and verifies the pages. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Validate recovery input
        run: |
          set -euo pipefail
          test -n "$COOLIFY_API_TOKEN" || { echo 'COOLIFY_TOKEN secret is missing'; exit 1; }
          git merge-base --is-ancestor ded7db6d57953622fa6e8c89d2eca8f192108402 HEAD

      - name: Reconnect route and verify production
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' 2>&1 | tee /tmp/paradigm-route-recovery.log
          const base = process.env.COOLIFY_API_URL.replace(/\/+$/, '')
          const token = process.env.COOLIFY_API_TOKEN
          const appUuid = process.env.PARADIGM_APP_UUID
          const site = 'https://paradigmjp.com'
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

          async function coolify(pathname, options = {}, allowFailure = false) {
            const response = await fetch(`${base}/api/v1${pathname}`, {
              ...options,
              signal: options.signal ?? AbortSignal.timeout(30_000),
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(options.headers || {}),
              },
            })
            const text = await response.text()
            let data = null
            try { data = text ? JSON.parse(text) : null } catch {}
            if (!response.ok && !allowFailure) {
              throw new Error(`${pathname} -> HTTP ${response.status}: ${text.slice(0, 500)}`)
            }
            return { ok: response.ok, status: response.status, data, text }
          }

          async function routeReady() {
            try {
              const response = await fetch(`${site}/api/ready?route_recovery=${Date.now()}`, {
                headers: { 'Cache-Control': 'no-cache' },
                signal: AbortSignal.timeout(15_000),
              })
              console.log(`route probe -> HTTP ${response.status}`)
              return response.ok
            } catch (error) {
              console.warn(`route probe -> ${error instanceof Error ? error.message : String(error)}`)
              return false
            }
          }

          async function reconnectRoute() {
            const restart = await coolify(`/applications/${appUuid}/restart`, { method: 'POST' }, true)
            console.log(`restart endpoint -> HTTP ${restart.status}: ${restart.text.slice(0, 200)}`)
            if (restart.ok) return

            const start = await coolify(`/applications/${appUuid}/start?force=false&instant_deploy=true`, { method: 'POST' }, true)
            console.log(`start endpoint -> HTTP ${start.status}: ${start.text.slice(0, 200)}`)
            if (start.ok) return

            const relabel = await coolify(`/applications/${appUuid}`, {
              method: 'PATCH',
              body: JSON.stringify({ force_domain_override: true }),
            }, true)
            console.log(`domain refresh -> HTTP ${relabel.status}: ${relabel.text.slice(0, 200)}`)
            if (!relabel.ok) throw new Error('Coolify restart, start, and domain refresh endpoints all failed')

            const finalStart = await coolify(`/applications/${appUuid}/start?force=false&instant_deploy=true`, { method: 'POST' })
            console.log(`final start -> ${JSON.stringify(finalStart.data)}`)
          }

          if (!(await routeReady())) {
            await reconnectRoute()
          }

          let healthy = false
          for (let attempt = 1; attempt <= 60; attempt += 1) {
            await sleep(5_000)
            healthy = await routeReady()
            console.log(`recovery probe ${attempt}/60 -> healthy=${healthy}`)
            if (healthy) break
            if (attempt === 20 || attempt === 40) {
              console.warn(`route still unavailable at probe ${attempt}; refreshing application route again`)
              await reconnectRoute()
            }
          }
          if (!healthy) throw new Error('Production route remained unavailable after fast route recovery')

          async function verifyPage(pathname, expected) {
            for (let attempt = 1; attempt <= 20; attempt += 1) {
              try {
                const response = await fetch(`${site}${pathname}?release_check=${Date.now()}`, {
                  headers: { 'Cache-Control': 'no-cache' },
                  signal: AbortSignal.timeout(20_000),
                })
                const html = await response.text()
                const missing = expected.filter((text) => !html.includes(text))
                console.log(`${pathname} ${attempt}/20 -> HTTP ${response.status}; missing=${missing.length}`)
                if (response.ok && missing.length === 0) return
              } catch (error) {
                console.warn(`${pathname} ${attempt}/20 -> ${error instanceof Error ? error.message : String(error)}`)
              }
              await sleep(5_000)
            }
            throw new Error(`${pathname} did not expose the expected production content`)
          }

          await verifyPage('/en', [
            'Enter Japan. Scale video production.',
            'Japan Market Partner',
            'Video as a Service',
          ])
          await verifyPage('/ja', [
            '動画・Web・AIを、必要なときに動かせる制作体制へ。',
            'Video as a Service',
            'Web制作',
            'AI制作・導入支援',
          ])
          await verifyPage('/en/japan-market-partner', [
            'Your outsourced Japan team, from setup to operation.',
            'Japan Market Setup',
            '$13,000',
          ])
          await verifyPage('/en/video-as-a-service', [
            'Turn video production into a reliable recurring workflow.',
            'One active request',
          ])
          await verifyPage('/ja/video-as-a-service', [
            '動画制作を、単発発注から継続できる制作体制へ。',
            '一件ずつ制作',
          ])

          console.log('All two-service production routes verified')
          NODE

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-service-route-recovery-${{ github.run_attempt }}
          path: /tmp/paradigm-route-recovery.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report recovery success
        if: success()
        run: |
          gh issue comment 569 --repo "$GITHUB_REPOSITORY" --body "✅ Fast route recovery completed. No application rebuild was performed. The public \`/ja\`, \`/en\`, Japan Market Partner, and both Video as a Service pages were verified on production. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Report recovery failure
        if: failure()
        run: |
          TAIL="$(tail -n 220 /tmp/paradigm-route-recovery.log 2>/dev/null || true)"
          printf -v BODY '❌ Fast production route recovery failed. Run: %s/%s/actions/runs/%s\n\n```text\n%s\n```' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$TAIL"
          gh issue comment 569 --repo "$GITHUB_REPOSITORY" --body "$BODY"
