name: Deploy Paradigm Production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-country-partner-release.yml
      - scripts/ops/repair-production-traefik.mjs
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: paradigmjp-production-release
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_API_URL: https://coolify.paradigmjp.com
      PARADIGM_APP_UUID: n8i2sjiqvr2d8hrzppop2m2i
      GH_TOKEN: ${{ github.token }}
      STATUS_CONTEXT: deployment/coolify-paradigmjp
      STATUS_TARGET: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish deployment pending status
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -cn --arg state pending --arg target_url "${STATUS_TARGET}" --arg description 'Deploying the latest main revision to Coolify' --arg context "${STATUS_CONTEXT}" '{state:$state,target_url:$target_url,description:$description,context:$context}')"

      - name: Force deploy latest main through Coolify
        run: |
          set -euo pipefail
          API="${COOLIFY_API_URL%/}/api/v1"
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            --header "Accept: application/json" \
            "${API}/deploy?uuid=${PARADIGM_APP_UUID}&force=true")"
          printf '%s\n' "$RESPONSE" | tee /tmp/coolify-deploy-request.json
          DEPLOYMENT_UUID="$(printf '%s' "$RESPONSE" | jq -er '.deployments[0].deployment_uuid // .deployment_uuid')"
          echo "deployment_uuid=${DEPLOYMENT_UUID}" >> "$GITHUB_ENV"

          for attempt in $(seq 1 120); do
            DETAIL="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              --header "Accept: application/json" \
              "${API}/deployments/${DEPLOYMENT_UUID}")"
            STATUS="$(printf '%s' "$DETAIL" | jq -r '.status // "unknown"')"
            COMMIT="$(printf '%s' "$DETAIL" | jq -r '.commit // "unknown"')"
            printf '[%s/120] status=%s commit=%s\n' "$attempt" "$STATUS" "$COMMIT" | tee -a /tmp/coolify-deploy.log
            printf '%s\n' "$DETAIL" > /tmp/coolify-deployment-latest.json
            case "$STATUS" in
              finished|success)
                echo "Coolify deployment completed."
                exit 0
                ;;
              failed|cancelled|canceled|cancelled-by-user|error)
                echo "Coolify deployment failed with status: $STATUS" >&2
                printf '%s\n' "$DETAIL" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Coolify deployment did not complete within the workflow timeout window." >&2
          exit 1

      - name: Repair production route and verify VaaS funnel
        run: |
          set -o pipefail
          node scripts/ops/repair-production-traefik.mjs 2>&1 | tee /tmp/production-route-verification.log

      - name: Publish deployment success status
        if: success()
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -cn --arg state success --arg target_url "${STATUS_TARGET}" --arg description 'Coolify deployment and live VaaS verification passed' --arg context "${STATUS_CONTEXT}" '{state:$state,target_url:$target_url,description:$description,context:$context}')"

      - name: Publish deployment failure status
        if: failure()
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -cn --arg state failure --arg target_url "${STATUS_TARGET}" --arg description 'Coolify deployment or live verification failed' --arg context "${STATUS_CONTEXT}" '{state:$state,target_url:$target_url,description:$description,context:$context}')"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paradigm-production-deployment
          path: |
            /tmp/coolify-deploy-request.json
            /tmp/coolify-deploy.log
            /tmp/coolify-deployment-latest.json
            /tmp/production-route-verification.log
          if-no-files-found: warn
          retention-days: 14
