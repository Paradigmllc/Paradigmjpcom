name: Deploy Paradigm Production

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - services/video-factory/**
      - src/app/admin/video-factory/**
      - src/app/api/video-factory/**
      - src/app/console/**
      - src/app/video-factory-console/**
      - src/app/v1/**
      - src/lib/relative-redirect.ts
      - src/lib/video-factory-internal-proxy.ts
      - scripts/ops/ensure-production-routing.mjs
      - scripts/ops/ensure-production-routing.test.mjs
      - scripts/ops/ensure-video-factory-storage.sh
      - scripts/ops/verify-production-pages.mjs
      - scripts/ops/verify-production-pages.test.mjs
      - .github/workflows/one-shot-country-partner-release.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('paradigmjp-production-validation-{0}', github.event.pull_request.number) || 'paradigmjp-production-release' }}
  cancel-in-progress: true

jobs:
  validate-routing-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate routing, storage, and public verification automation
        run: |
          node --check scripts/ops/ensure-production-routing.mjs
          node --check scripts/ops/verify-production-pages.mjs
          node scripts/ops/ensure-production-routing.test.mjs
          node scripts/ops/verify-production-pages.test.mjs
          bash -n scripts/ops/ensure-video-factory-storage.sh
          sh -n docker-entrypoint.sh
          grep -q 'video_factory.web:app' docker-entrypoint.sh
          grep -q 'legacy Traefik route is synchronized' docker-entrypoint.sh
          grep -q '/mnt/coolify-proxy-dynamic' scripts/ops/ensure-video-factory-storage.sh
          grep -q 'Cancel stale Paradigm deployments' .github/workflows/one-shot-country-partner-release.yml
          grep -q 'services/video-factory' Dockerfile

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate-routing-automation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_API_URL: https://coolify.paradigmjp.com
      PARADIGM_APP_UUID: n8i2sjiqvr2d8hrzppop2m2i
      GH_TOKEN: ${{ github.token }}
      STATUS_CONTEXT: deployment/coolify-paradigmjp
      STATUS_TARGET: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish deployment pending status
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -cn --arg state pending --arg target_url "${STATUS_TARGET}" --arg description 'Deploying and verifying Paradigm production' --arg context "${STATUS_CONTEXT}" '{state:$state,target_url:$target_url,description:$description,context:$context}')"

      - name: Ensure persistent Video Factory and route storage
        run: bash scripts/ops/ensure-video-factory-storage.sh

      - name: Configure durable production routing
        run: node scripts/ops/ensure-production-routing.mjs

      - name: Cancel stale Paradigm deployments
        run: |
          set -euo pipefail
          API="${COOLIFY_API_URL%/}/api/v1"
          coolify_get() {
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              --header "Accept: application/json" \
              "$1"
          }
          coolify_post() {
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              --header "Accept: application/json" \
              "$1"
          }
          matching_deployments() {
            coolify_get "${API}/deployments" | jq -r --arg app "${PARADIGM_APP_UUID}" '
              .[]?
              | select((.status // "") == "queued" or (.status // "") == "in_progress")
              | select(
                  (.application.uuid // .application_uuid // .resource_uuid // "") == $app
                  or ((.application.id // .application_id // 0) == 2)
                )
              | (.deployment_uuid // .uuid // empty)
            '
          }

          mapfile -t stale < <(matching_deployments)
          if [ "${#stale[@]}" -eq 0 ]; then
            echo "No stale Paradigm deployment is holding the Coolify queue"
          else
            printf 'Cancelling %s stale Paradigm deployment(s)\n' "${#stale[@]}"
            for deployment in "${stale[@]}"; do
              [ -n "${deployment}" ] || continue
              echo "Cancelling ${deployment}"
              coolify_post "${API}/deployments/${deployment}/cancel" \
                | tee -a /tmp/coolify-stale-cancel.jsonl || true
            done
          fi

          for attempt in $(seq 1 30); do
            mapfile -t remaining < <(matching_deployments)
            if [ "${#remaining[@]}" -eq 0 ]; then
              echo "Coolify deployment queue is clear for ${PARADIGM_APP_UUID}"
              exit 0
            fi
            printf '[%s/30] waiting for stale deployment cancellation: %s\n' \
              "${attempt}" "${remaining[*]}"
            sleep 2
          done

          echo "Stale Paradigm deployments remain after cancellation" >&2
          exit 1

      - name: Deploy latest main through Coolify
        run: |
          set -euo pipefail
          API="${COOLIFY_API_URL%/}/api/v1"
          coolify_get() {
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              --header "Accept: application/json" \
              "$1"
          }
          coolify_post() {
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              --header "Accept: application/json" \
              "$1"
          }

          request_deployment() {
            local response
            response="$(coolify_get "${API}/deploy?uuid=${PARADIGM_APP_UUID}&force=true")"
            printf '%s\n' "$response" > /tmp/coolify-deploy-request.json
            printf '%s\n' "$response" >&2
            printf '%s' "$response" | jq -er '.deployments[0].deployment_uuid // .deployment_uuid'
          }

          deployment_uuid="$(request_deployment)"
          echo "deployment_uuid=${deployment_uuid}" >> "$GITHUB_ENV"
          queued_without_worker=0
          retried=0

          for attempt in $(seq 1 450); do
            detail="$(coolify_get "${API}/deployments/${deployment_uuid}")"
            status="$(printf '%s' "$detail" | jq -r '.status // "unknown"')"
            commit="$(printf '%s' "$detail" | jq -r '.commit // "unknown"')"
            worker="$(printf '%s' "$detail" | jq -r '.horizon_job_worker // .horizon_job_id // "none"')"
            printf '[%s/450] status=%s commit=%s worker=%s\n' "$attempt" "$status" "$commit" "$worker" | tee -a /tmp/coolify-deploy.log
            printf '%s\n' "$detail" > /tmp/coolify-deployment-latest.json
            case "$status" in
              finished|success)
                exit 0
                ;;
              failed|cancelled|canceled|cancelled-by-user|error)
                printf '%s\n' "$detail" >&2
                exit 1
                ;;
              queued)
                if [ "$worker" = "none" ]; then
                  queued_without_worker=$((queued_without_worker + 1))
                else
                  queued_without_worker=0
                fi
                ;;
              *)
                queued_without_worker=0
                ;;
            esac

            if [ "$queued_without_worker" -ge 45 ] && [ "$retried" -eq 0 ]; then
              echo "Deployment ${deployment_uuid} remained queued without a Horizon worker; cancelling and retrying once"
              coolify_post "${API}/deployments/${deployment_uuid}/cancel" \
                | tee -a /tmp/coolify-stale-cancel.jsonl || true
              sleep 5
              deployment_uuid="$(request_deployment)"
              echo "deployment_uuid=${deployment_uuid}" >> "$GITHUB_ENV"
              queued_without_worker=0
              retried=1
            fi
            sleep 8
          done

          echo "Coolify deployment did not complete in time" >&2
          exit 1

      - name: Verify public VaaS funnel
        run: node scripts/ops/verify-production-pages.mjs

      - name: Verify embedded Video Factory runtime
        run: |
          set -euo pipefail
          response_ok() {
            case "$1" in
              200|301|302|303|307|308) return 0 ;;
              *) return 1 ;;
            esac
          }
          header_location() {
            awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); value=$0 } END { print value }' "$1"
          }
          public_location_ok() {
            case "$1" in
              "") return 0 ;;
              *0.0.0.0*|*127.0.0.1*|*localhost*) return 1 ;;
              /*|https://www.paradigmjp.com/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          for attempt in $(seq 1 90); do
            ready_code="$(curl --silent --show-error --output /tmp/video-factory-ready.json \
              --write-out '%{http_code}' --max-time 20 \
              https://paradigmjp.com/api/video-factory/ready || true)"
            edge_redirect_code="$(curl --silent --show-error --dump-header /tmp/video-factory-edge.headers --output /dev/null \
              --write-out '%{http_code}' --max-time 20 \
              --header 'Accept: text/html' \
              https://paradigmjp.com/console/ || true)"
            auth_redirect_code="$(curl --silent --show-error --dump-header /tmp/video-factory-auth.headers --output /dev/null \
              --write-out '%{http_code}' --max-time 20 \
              --header 'Accept: text/html' \
              https://www.paradigmjp.com/console/ || true)"
            admin_redirect_code="$(curl --silent --show-error --dump-header /tmp/video-factory-admin.headers --output /dev/null \
              --write-out '%{http_code}' --max-time 20 \
              --header 'Accept: text/html' \
              https://www.paradigmjp.com/admin/video-factory || true)"
            alias_code="$(curl --silent --show-error --dump-header /tmp/video-factory-alias.headers --output /dev/null \
              --write-out '%{http_code}' --max-time 20 \
              --header 'Accept: text/html' \
              https://www.paradigmjp.com/video-factory-console || true)"
            edge_location="$(header_location /tmp/video-factory-edge.headers)"
            auth_location="$(header_location /tmp/video-factory-auth.headers)"
            admin_location="$(header_location /tmp/video-factory-admin.headers)"
            alias_location="$(header_location /tmp/video-factory-alias.headers)"
            if [ "${ready_code}" = "200" ] \
              && jq -e '.ready == true and .service == "video-factory"' /tmp/video-factory-ready.json >/dev/null \
              && response_ok "${edge_redirect_code}" \
              && response_ok "${auth_redirect_code}" \
              && response_ok "${admin_redirect_code}" \
              && response_ok "${alias_code}" \
              && public_location_ok "${edge_location}" \
              && public_location_ok "${auth_location}" \
              && public_location_ok "${admin_location}" \
              && public_location_ok "${alias_location}"; then
              exit 0
            fi
            printf '[%s/90] ready=%s edge=%s:%s auth=%s:%s admin=%s:%s alias=%s:%s\n' \
              "${attempt}" "${ready_code}" \
              "${edge_redirect_code}" "${edge_location}" \
              "${auth_redirect_code}" "${auth_location}" \
              "${admin_redirect_code}" "${admin_location}" \
              "${alias_code}" "${alias_location}"
            sleep 5
          done
          echo "Embedded Video Factory verification failed" >&2
          exit 1

      - name: Publish deployment success status
        if: success()
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -cn --arg state success --arg target_url "${STATUS_TARGET}" --arg description 'Production, VaaS, and Video Factory verification passed' --arg context "${STATUS_CONTEXT}" '{state:$state,target_url:$target_url,description:$description,context:$context}')"

      - name: Publish deployment failure status
        if: failure()
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -cn --arg state failure --arg target_url "${STATUS_TARGET}" --arg description 'Routing, deployment, public, or Video Factory verification failed' --arg context "${STATUS_CONTEXT}" '{state:$state,target_url:$target_url,description:$description,context:$context}')"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paradigm-production-deployment
          path: |
            /tmp/application-routing-after.json
            /tmp/coolify-stale-cancel.jsonl
            /tmp/coolify-deploy-request.json
            /tmp/coolify-deploy.log
            /tmp/coolify-deployment-latest.json
            /tmp/production-verification.json
            /tmp/video-factory-ready.json
            /tmp/video-factory-edge.headers
            /tmp/video-factory-auth.headers
            /tmp/video-factory-admin.headers
            /tmp/video-factory-alias.headers
          if-no-files-found: warn
          retention-days: 14
