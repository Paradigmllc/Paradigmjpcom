name: One-shot Country Partner Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-country-partner-release.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: paradigmjp-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_API_URL: https://coolify.paradigmjp.com
      PARADIGM_APP_UUID: n8i2sjiqvr2d8hrzppop2m2i
      PARADIGM_DEPLOY_HOST: paradigm-droplet
      NODE_OPTIONS: --max-old-space-size=4096
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Report release start
        run: |
          gh issue comment 566 --repo "$GITHUB_REPOSITORY" --body "Formal production release attempt started from \`$(git rev-parse HEAD)\`. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate Coolify credential
        run: |
          set -euo pipefail
          if [ -z "$COOLIFY_API_TOKEN" ]; then
            gh issue comment 566 --repo "$GITHUB_REPOSITORY" --body "Credential check failed: repository secret \`COOLIFY_TOKEN\` is missing. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 1
          fi
          echo 'Coolify API credential is available'

      - name: Restore production SSH from Coolify key vault
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'

          const base = process.env.COOLIFY_API_URL.replace(/\/+$/, '')
          const token = process.env.COOLIFY_API_TOKEN
          async function api(pathname) {
            const response = await fetch(`${base}/api/v1${pathname}`, {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
              signal: AbortSignal.timeout(30_000),
            })
            const text = await response.text()
            if (!response.ok) throw new Error(`${pathname} -> HTTP ${response.status}: ${text.slice(0, 180)}`)
            return text ? JSON.parse(text) : null
          }

          const serversRaw = await api('/servers')
          const servers = Array.isArray(serversRaw) ? serversRaw : serversRaw?.data ?? []
          const server = servers.find((item) =>
            item?.ip === '178.105.138.55' ||
            /paradigm-prod|paradigm/i.test(String(item?.name ?? ''))
          )
          if (!server) throw new Error('Paradigm production server was not found through Coolify API')
          const serverInfo = {
            ip: server.ip,
            user: server.user || 'root',
            port: Number(server.port || 22),
            name: server.name || 'paradigm-production',
          }
          fs.writeFileSync('/tmp/paradigm-server.json', JSON.stringify(serverInfo), { mode: 0o600 })

          const keysRaw = await api('/security/keys')
          const listed = Array.isArray(keysRaw) ? keysRaw : keysRaw?.data ?? []
          let saved = 0
          for (const listedKey of listed) {
            let key = listedKey
            if ((!key?.private_key || !String(key.private_key).includes('PRIVATE KEY')) && key?.uuid) {
              try {
                key = await api(`/security/keys/${encodeURIComponent(key.uuid)}`)
              } catch (error) {
                console.warn(`Could not read one Coolify key detail: ${error instanceof Error ? error.message : String(error)}`)
                continue
              }
            }
            const privateKey = typeof key?.private_key === 'string' ? key.private_key.trim() : ''
            if (!privateKey.includes('PRIVATE KEY')) continue
            const target = path.join('/tmp', `coolify-ssh-key-${saved}`)
            fs.writeFileSync(target, `${privateKey}\n`, { mode: 0o600 })
            saved += 1
          }
          if (saved === 0) {
            throw new Error('Coolify token cannot read any registered SSH private key; read:sensitive permission is required')
          }
          console.log(`Coolify SSH candidates restored: ${saved}; production server: ${serverInfo.name}`)
          NODE

          SERVER_IP="$(node -e "const x=require('/tmp/paradigm-server.json');process.stdout.write(x.ip)")"
          SERVER_USER="$(node -e "const x=require('/tmp/paradigm-server.json');process.stdout.write(x.user)")"
          SERVER_PORT="$(node -e "const x=require('/tmp/paradigm-server.json');process.stdout.write(String(x.port))")"
          SELECTED=''
          for candidate in /tmp/coolify-ssh-key-*; do
            if ssh -i "$candidate" -p "$SERVER_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 "$SERVER_USER@$SERVER_IP" 'echo production-ssh-ok' >/tmp/ssh-test.out 2>/tmp/ssh-test.err; then
              SELECTED="$candidate"
              break
            fi
          done
          if [ -z "$SELECTED" ]; then
            echo 'No Coolify key authenticated to the production server'
            sed -n '1,20p' /tmp/ssh-test.err || true
            exit 1
          fi
          install -m 600 "$SELECTED" "$HOME/.ssh/id_ed25519"
          rm -f /tmp/coolify-ssh-key-* /tmp/ssh-test.out /tmp/ssh-test.err
          cat > "$HOME/.ssh/config" <<EOF
          Host paradigm-droplet
              HostName $SERVER_IP
              User $SERVER_USER
              Port $SERVER_PORT
              IdentityFile ~/.ssh/id_ed25519
              IdentitiesOnly yes
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              ConnectTimeout 20
              ServerAliveInterval 15
              ServerAliveCountMax 4
          EOF
          chmod 600 "$HOME/.ssh/config"
          ssh paradigm-droplet 'echo production-ssh-restored'

      - name: Install locked dependencies
        run: npm ci

      - name: Verify clean release checkout
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 41c3e88f97d02e0bfd9357884ae3cc5a45c736b7 HEAD || {
            echo 'Country Partner merge commit is not present in release checkout'
            exit 1
          }

      - name: Run formal production release gate
        run: |
          set -o pipefail
          npm run release:prod 2>&1 | tee /tmp/paradigm-release.log

      - name: Verify public Country Partner fingerprint
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const expected = [
            'Your Japan Country Partner',
            'Japan Market Setup',
            'Apply for a Japan Partnership — $13K',
            'Limited founding-partner capacity',
          ]
          const response = await fetch(`https://paradigmjp.com/en?release_check=${Date.now()}`, {
            headers: { 'Cache-Control': 'no-cache' },
          })
          if (!response.ok) throw new Error(`/en returned HTTP ${response.status}`)
          const html = await response.text()
          for (const text of expected) {
            if (!html.includes(text)) throw new Error(`Missing production fingerprint: ${text}`)
            console.log(`verified: ${text}`)
          }
          const ready = await fetch(`https://paradigmjp.com/api/ready?release_check=${Date.now()}`, {
            headers: { 'Cache-Control': 'no-cache' },
          })
          if (!ready.ok) throw new Error(`/api/ready returned HTTP ${ready.status}`)
          console.log(`/api/ready -> HTTP ${ready.status}`)
          NODE

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: country-partner-release-evidence-${{ github.run_attempt }}
          path: /tmp/paradigm-release.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report release success
        if: success()
        run: |
          DEPLOYMENT_ID="$(grep -Eo '[a-z0-9]{20,40}' /tmp/paradigm-release.log 2>/dev/null | tail -n 1 || true)"
          gh issue comment 566 --repo "$GITHUB_REPOSITORY" --body "✅ Formal production release completed. Main: \`$(git rev-parse HEAD)\`. Deployment evidence ID: \`${DEPLOYMENT_ID:-see release artifact}\`. Country Partner fingerprints and \`/api/ready\` verified. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Report release failure
        if: failure()
        run: |
          TAIL="$(tail -n 100 /tmp/paradigm-release.log 2>/dev/null || true)"
          printf -v BODY '❌ Formal production release failed. Run: %s/%s/actions/runs/%s\n\n```text\n%s\n```' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$TAIL"
          gh issue comment 566 --repo "$GITHUB_REPOSITORY" --body "$BODY"
