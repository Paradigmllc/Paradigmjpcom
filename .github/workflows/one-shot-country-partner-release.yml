name: One-shot Direct Production Traefik Repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-country-partner-release.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: paradigmjp-production-release
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_API_URL: https://coolify.paradigmjp.com
      PARADIGM_APP_UUID: n8i2sjiqvr2d8hrzppop2m2i
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Report repair start
        run: |
          gh issue comment 571 --repo "$GITHUB_REPOSITORY" --body "Direct host-route repair script started. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Repair Traefik upstream and verify public routes
        run: |
          set -o pipefail
          node scripts/ops/repair-production-traefik.mjs 2>&1 | tee /tmp/direct-traefik-repair.log

      - name: Report repair success
        if: success()
        run: |
          TAIL="$(tail -n 30 /tmp/direct-traefik-repair.log)"
          printf -v BODY '✅ Direct Traefik repair completed and all public two-service routes were verified.\n\n```text\n%s\n```' "$TAIL"
          gh issue comment 571 --repo "$GITHUB_REPOSITORY" --body "$BODY"

      - name: Report repair failure
        if: failure()
        run: |
          TAIL="$(tail -n 80 /tmp/direct-traefik-repair.log 2>/dev/null || true)"
          printf -v BODY '❌ Direct Traefik repair failed.\n\n```text\n%s\n```' "$TAIL"
          gh issue comment 571 --repo "$GITHUB_REPOSITORY" --body "$BODY"
