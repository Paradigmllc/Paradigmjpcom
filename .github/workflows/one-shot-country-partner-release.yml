name: Deploy Paradigm Production

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/ops/ensure-production-routing.mjs
      - scripts/ops/ensure-production-routing.test.mjs
      - .github/workflows/one-shot-country-partner-release.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: paradigmjp-production-release
  cancel-in-progress: true

jobs:
  validate-routing-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate routing automation
        run: |
          node --check scripts/ops/ensure-production-routing.mjs
          node scripts/ops/ensure-production-routing.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate-routing-automation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_API_URL: https://coolify.paradigmjp.com
      PARADIGM_APP_UUID: n8i2sjiqvr2d8hrzppop2m2i
      GH_TOKEN: ${{ github.token }}
      STATUS_CONTEXT: deployment/coolify-paradigmjp
      STATUS_TARGET: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish deployment pending status
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -cn --arg state pending --arg target_url "${STATUS_TARGET}" --arg description 'Deploying and verifying Paradigm production' --arg context "${STATUS_CONTEXT}" '{state:$state,target_url:$target_url,description:$description,context:$context}')"

      - name: Configure durable production routing
        run: node scripts/ops/ensure-production-routing.mjs

      - name: Deploy latest main through Coolify
        run: |
          set -euo pipefail
          API="${COOLIFY_API_URL%/}/api/v1"
          coolify_get() {
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              --header "Accept: application/json" \
              "$1"
          }

          response="$(coolify_get "${API}/deploy?uuid=${PARADIGM_APP_UUID}&force=true")"
          printf '%s\n' "$response" | tee /tmp/coolify-deploy-request.json
          deployment_uuid="$(printf '%s' "$response" | jq -er '.deployments[0].deployment_uuid // .deployment_uuid')"
          echo "deployment_uuid=${deployment_uuid}" >> "$GITHUB_ENV"

          for attempt in $(seq 1 150); do
            detail="$(coolify_get "${API}/deployments/${deployment_uuid}")"
            status="$(printf '%s' "$detail" | jq -r '.status // "unknown"')"
            commit="$(printf '%s' "$detail" | jq -r '.commit // "unknown"')"
            printf '[%s/150] status=%s commit=%s\n' "$attempt" "$status" "$commit" | tee -a /tmp/coolify-deploy.log
            printf '%s\n' "$detail" > /tmp/coolify-deployment-latest.json
            case "$status" in
              finished|success)
                exit 0
                ;;
              failed|cancelled|canceled|cancelled-by-user|error)
                printf '%s\n' "$detail" >&2
                exit 1
                ;;
            esac
            sleep 8
          done

          echo "Coolify deployment did not complete in time" >&2
          exit 1

      - name: Verify public VaaS funnel
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs"
          import { setTimeout as sleep } from "node:timers/promises"

          const site = "https://paradigmjp.com"
          const specs = [
            ["/ja", ["Video as a Service", "Web制作", "AI制作・導入支援"]],
            ["/en", ["Japan Market Partner", "Video as a Service"]],
            ["/ja/video-as-a-service", ["動画制作チームを、採用せずに。", "$1,500", "$3,500", "$5,500", "契約前によくある質問"]],
            ["/en/video-as-a-service", ["Your on-demand video production team.", "$1,500", "$3,500", "$5,500", "Questions before you subscribe"]],
            ["/ja/video-as-a-service/terms", ["Video as a Service 利用規約", "2026年7月28日", "契約文書の優先順位"]],
            ["/en/video-as-a-service/terms", ["Video as a Service Terms", "July 28, 2026", "Order of precedence"]],
            ["/ja/contact?intent=video-as-a-service&plan=unlimited", ["Video as a Service 申込み", "希望プラン", "Unlimited", "素材の準備状況"]],
            ["/en/contact?intent=video-as-a-service&plan=unlimited", ["Apply for Video as a Service", "Preferred plan", "Unlimited", "Asset readiness"]],
            ["/api/ready", []],
          ]

          async function probe(pathname, markers) {
            try {
              const url = new URL(pathname, site)
              url.searchParams.set("deployment_verify", String(Date.now()))
              const response = await fetch(url, {
                headers: { "Cache-Control": "no-cache" },
                redirect: "follow",
                signal: AbortSignal.timeout(25_000),
              })
              const body = await response.text()
              const missing = markers.filter((marker) => !body.includes(marker))
              return { pathname, status: response.status, ok: response.ok && missing.length === 0, missing }
            } catch (error) {
              return {
                pathname,
                status: 0,
                ok: false,
                missing: [],
                error: error instanceof Error ? error.message : String(error),
              }
            }
          }

          let results = []
          for (let attempt = 1; attempt <= 36; attempt += 1) {
            results = await Promise.all(specs.map(([pathname, markers]) => probe(pathname, markers)))
            console.log(`attempt ${attempt}/36: ${results.filter((result) => result.ok).length}/${results.length} passed`)
            for (const result of results) {
              console.log(`${result.ok ? "PASS" : "FAIL"} ${result.pathname} HTTP ${result.status}; missing=${result.missing.join(" | ") || "none"}${result.error ? `; error=${result.error}` : ""}`)
            }
            if (results.every((result) => result.ok)) break
            await sleep(5_000)
          }

          fs.writeFileSync("/tmp/production-verification.json", `${JSON.stringify(results, null, 2)}\n`)
          if (!results.every((result) => result.ok)) process.exit(1)
          NODE

      - name: Publish deployment success status
        if: success()
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -cn --arg state success --arg target_url "${STATUS_TARGET}" --arg description 'Production deployment and VaaS verification passed' --arg context "${STATUS_CONTEXT}" '{state:$state,target_url:$target_url,description:$description,context:$context}')"

      - name: Publish deployment failure status
        if: failure()
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -cn --arg state failure --arg target_url "${STATUS_TARGET}" --arg description 'Routing, deployment, or public verification failed' --arg context "${STATUS_CONTEXT}" '{state:$state,target_url:$target_url,description:$description,context:$context}')"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paradigm-production-deployment
          path: |
            /tmp/application-routing-after.json
            /tmp/coolify-deploy-request.json
            /tmp/coolify-deploy.log
            /tmp/coolify-deployment-latest.json
            /tmp/production-verification.json
          if-no-files-found: warn
          retention-days: 14
