name: One-shot Country Partner Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-country-partner-release.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: paradigmjp-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_API_URL: https://coolify.paradigmjp.com
      PARADIGM_APP_UUID: n8i2sjiqvr2d8hrzppop2m2i
      NODE_OPTIONS: --max-old-space-size=4096
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Report release start
        run: |
          gh issue comment 566 --repo "$GITHUB_REPOSITORY" --body "Production route-recovery release started from \`$(git rev-parse HEAD)\`. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate release input
        run: |
          set -euo pipefail
          test -n "$COOLIFY_API_TOKEN" || { echo 'COOLIFY_TOKEN secret is missing'; exit 1; }
          git merge-base --is-ancestor 41c3e88f97d02e0bfd9357884ae3cc5a45c736b7 HEAD

      - name: Install locked dependencies
        run: npm ci

      - name: Recheck application code
        run: |
          set -euo pipefail
          npm exec -- tsc --noEmit --pretty false
          npm exec -- vitest run src/lib/japan-entry-public-copy.test.ts src/lib/public-content-safety.test.ts src/lib/jsonld.test.ts

      - name: Recover route, seed, and verify production
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' 2>&1 | tee /tmp/paradigm-release.log
          import fs from 'node:fs'

          const base = process.env.COOLIFY_API_URL.replace(/\/+$/, '')
          const token = process.env.COOLIFY_API_TOKEN
          const appUuid = process.env.PARADIGM_APP_UUID
          const site = 'https://paradigmjp.com'
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

          async function coolify(pathname, options = {}) {
            const response = await fetch(`${base}/api/v1${pathname}`, {
              ...options,
              signal: options.signal ?? AbortSignal.timeout(30_000),
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(options.headers || {}),
              },
            })
            const text = await response.text()
            let data = null
            try { data = text ? JSON.parse(text) : null } catch {}
            if (!response.ok) throw new Error(`${pathname} -> HTTP ${response.status}: ${text.slice(0, 300)}`)
            return data
          }

          function normalizeEnvRows(rows) {
            const map = new Map()
            for (const row of [...rows].sort((a, b) => Number(Boolean(a?.is_preview)) - Number(Boolean(b?.is_preview)))) {
              if (!row?.key) continue
              const raw = typeof row.real_value === 'string' && row.real_value.length > 0 ? row.real_value : row.value
              if (raw === undefined || raw === null) continue
              map.set(row.key, String(raw).trim().replace(/^['"]|['"]$/g, ''))
            }
            return Object.fromEntries(map)
          }

          async function triggerAndWait(cycle) {
            const queued = await coolify(`/deploy?uuid=${appUuid}&force=true`, { method: 'POST' })
            const uuid = queued?.deployments?.[0]?.deployment_uuid || queued?.deployment_uuid
            if (!uuid) throw new Error(`No deployment UUID returned in cycle ${cycle}`)
            fs.appendFileSync('/tmp/deployment-id', `${uuid}\n`)
            console.log(`[cycle ${cycle}] Deployment queued: ${uuid}`)
            for (let attempt = 1; attempt <= 100; attempt += 1) {
              await sleep(15_000)
              const status = await coolify(`/deployments/${uuid}`)
              const state = status?.status || 'unknown'
              console.log(`[cycle ${cycle} deploy ${attempt}/100] ${state}`)
              if (['finished', 'running:healthy', 'success', 'succeeded'].includes(state)) {
                console.log(`[cycle ${cycle}] Deployment finished: ${uuid}`)
                return uuid
              }
              if (['failed', 'error', 'cancelled', 'canceled'].includes(state)) {
                const logs = typeof status?.logs === 'string' ? status.logs.slice(-6000) : ''
                throw new Error(`Coolify deployment ${uuid} ${state}\n${logs}`)
              }
            }
            throw new Error(`Deployment ${uuid} timed out`)
          }

          async function readyProbe() {
            try {
              const response = await fetch(`${site}/api/ready?route_recovery=${Date.now()}`, {
                headers: { 'Cache-Control': 'no-cache' },
                signal: AbortSignal.timeout(20_000),
              })
              return response.ok
            } catch {
              return false
            }
          }

          console.log('Reading production environment through Coolify API')
          const envRows = await coolify(`/applications/${appUuid}/envs`)
          const env = normalizeEnvRows(Array.isArray(envRows) ? envRows : [])

          let routeHealthy = await readyProbe()
          console.log(`Initial public route healthy: ${routeHealthy}`)
          const deploymentIds = []
          for (let cycle = 1; cycle <= 3 && !routeHealthy; cycle += 1) {
            deploymentIds.push(await triggerAndWait(cycle))
            for (let probe = 1; probe <= 18; probe += 1) {
              await sleep(10_000)
              routeHealthy = await readyProbe()
              console.log(`[cycle ${cycle} route ${probe}/18] healthy=${routeHealthy}`)
              if (routeHealthy) break
            }
            if (!routeHealthy) {
              console.warn(`[cycle ${cycle}] fixed route still points to a retired container; cycling once more to reuse the released Docker IP`)
            }
          }
          if (!routeHealthy) throw new Error('Public route remained unavailable after three deployment cycles')
          console.log(`Public route recovered; deployments=${deploymentIds.join(',') || 'existing deployment'}`)

          const adminSecret = env.ADMIN_SCRIPT_SECRET
          if (!adminSecret || adminSecret.length < 16) throw new Error('ADMIN_SCRIPT_SECRET is unavailable from Coolify environment')
          let seeded = false
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(`${site}/api/admin/seed-all-content`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-secret': adminSecret },
                body: JSON.stringify({ confirm: true, scope: 'homepage' }),
                signal: AbortSignal.timeout(180_000),
              })
              const text = await response.text()
              console.log(`[homepage seed ${attempt}/12] HTTP ${response.status}`)
              if (response.ok) {
                seeded = true
                break
              }
              if (![502, 503, 504].includes(response.status)) {
                throw new Error(`Homepage seed HTTP ${response.status}: ${text.slice(0, 500)}`)
              }
            } catch (error) {
              console.warn(`[homepage seed ${attempt}/12] ${error instanceof Error ? error.message : String(error)}`)
            }
            await sleep(10_000)
          }
          if (!seeded) throw new Error('Homepage CMS seed did not succeed after route recovery')
          console.log('Homepage CMS seed completed')

          const expected = [
            'Your Japan Country Partner',
            'Japan Market Setup',
            'Apply for a Japan Partnership — $13K',
            'Limited founding-partner capacity',
          ]
          let fingerprintOk = false
          for (let attempt = 1; attempt <= 24; attempt += 1) {
            const response = await fetch(`${site}/en?release_check=${Date.now()}`, {
              headers: { 'Cache-Control': 'no-cache' },
              signal: AbortSignal.timeout(30_000),
            })
            const html = await response.text()
            const missing = expected.filter((text) => !html.includes(text))
            console.log(`[fingerprint ${attempt}/24] HTTP ${response.status}; missing=${missing.length}`)
            if (response.ok && missing.length === 0) {
              for (const text of expected) console.log(`verified: ${text}`)
              fingerprintOk = true
              break
            }
            await sleep(10_000)
          }
          if (!fingerprintOk) throw new Error('Production /en did not expose all Country Partner fingerprints')

          const ready = await fetch(`${site}/api/ready?release_check=${Date.now()}`, {
            headers: { 'Cache-Control': 'no-cache' },
            signal: AbortSignal.timeout(30_000),
          })
          if (!ready.ok) throw new Error(`/api/ready returned HTTP ${ready.status}`)
          console.log(`/api/ready -> HTTP ${ready.status}`)

          const healthSecret = env.TRIGGER_WEBHOOK_SECRET
          if (!healthSecret) throw new Error('TRIGGER_WEBHOOK_SECRET is unavailable from Coolify environment')
          const health = await fetch(`${site}/api/sales/health?release_check=${Date.now()}`, {
            headers: { 'x-webhook-secret': healthSecret, 'Cache-Control': 'no-cache' },
            signal: AbortSignal.timeout(30_000),
          })
          const healthText = await health.text()
          let healthJson = null
          try { healthJson = healthText ? JSON.parse(healthText) : null } catch {}
          if (!health.ok || healthJson?.ok !== true) {
            throw new Error(`/api/sales/health failed: HTTP ${health.status} ${healthText.slice(0, 1000)}`)
          }
          console.log('/api/sales/health -> ok:true')
          NODE

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: country-partner-release-evidence-${{ github.run_attempt }}
          path: |
            /tmp/paradigm-release.log
            /tmp/deployment-id
          if-no-files-found: warn
          retention-days: 7

      - name: Report release success
        if: success()
        run: |
          DEPLOYMENT_IDS="$(tr '\n' ',' < /tmp/deployment-id 2>/dev/null | sed 's/,$//' || true)"
          gh issue comment 566 --repo "$GITHUB_REPOSITORY" --body "✅ Production release completed. Main: \`$(git rev-parse HEAD)\`. Coolify deployments: \`${DEPLOYMENT_IDS:-existing deployment}\`. Fixed route recovered, homepage CMS seed completed, Country Partner 4 fingerprints, \`/api/ready\`, and authenticated \`/api/sales/health ok:true\` verified. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Report release failure
        if: failure()
        run: |
          TAIL="$(tail -n 140 /tmp/paradigm-release.log 2>/dev/null || true)"
          printf -v BODY '❌ Production release failed. Run: %s/%s/actions/runs/%s\n\n```text\n%s\n```' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$TAIL"
          gh issue comment 566 --repo "$GITHUB_REPOSITORY" --body "$BODY"
