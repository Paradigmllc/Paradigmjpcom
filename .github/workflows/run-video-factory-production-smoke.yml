name: Run Video Factory Production Smoke

on:
  pull_request:
    paths:
      - .github/workflows/run-video-factory-production-smoke.yml
      - scripts/ops/run_video_factory_production_smoke.py
      - .github/workflows/activate-vast-via-runtime-task.yml
      - scripts/ops/activate_vast_runtime_v2.py
      - scripts/ops/activate_vast_from_runtime.py
      - scripts/vast/provision-video-factory-wan22.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run-video-factory-production-smoke
  cancel-in-progress: true

env:
  COOLIFY_API_URL: https://coolify.paradigmjp.com
  PARADIGM_APP_UUID: n8i2sjiqvr2d8hrzppop2m2i
  TASK_NAME: Video Factory Full Production Smoke V1
  MARKER_BRANCH: agent/harden-vast-comfyui-runtime
  MARKER_PATH: .ops/video-factory-production-smoke.json

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate production smoke source
        run: python3 -m py_compile scripts/ops/run_video_factory_production_smoke.py

      - name: Read production admin signing secret
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            --header "Accept: application/json" \
            --header "User-Agent: Paradigm-Video-Factory-Smoke/1.0" \
            "${COOLIFY_API_URL%/}/api/v1/applications/${PARADIGM_APP_UUID}/envs")"
          secret="$(printf '%s' "${response}" | jq -er '
            (.environment_variables // .envs // . // [])
            | map(select((.is_preview // false) == false))
            | map(select(.key == "VIDEO_FACTORY_INTERNAL_API_KEY" or .key == "ADMIN_SCRIPT_SECRET" or .key == "ADMIN_PASSWORD" or .key == "PAYLOAD_SECRET"))
            | sort_by(if .key == "VIDEO_FACTORY_INTERNAL_API_KEY" then 0 elif .key == "ADMIN_SCRIPT_SECRET" then 1 elif .key == "ADMIN_PASSWORD" then 2 else 3 end)
            | .[0]
            | (.real_value // .value // empty)
          ')"
          [ -n "${secret}" ] || { echo "Production admin secret is unavailable" >&2; exit 1; }
          echo "::add-mask::${secret}"
          printf '%s' "${secret}" > /tmp/paradigm-admin-secret
          chmod 600 /tmp/paradigm-admin-secret

      - name: Create one-shot production smoke task
        id: task
        run: |
          set -euo pipefail
          API="${COOLIFY_API_URL%/}/api/v1"
          auth=(-H "Authorization: Bearer ${COOLIFY_API_TOKEN}" -H "Accept: application/json")
          current="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "${API}/applications/${PARADIGM_APP_UUID}/scheduled-tasks")"
          printf '%s' "${current}" | jq -r --arg name "${TASK_NAME}" '.[]? | select(.name == $name) | .uuid' \
            | while read -r uuid; do
                [ -n "${uuid}" ] || continue
                curl --silent --show-error --request DELETE "${auth[@]}" \
                  "${API}/applications/${PARADIGM_APP_UUID}/scheduled-tasks/${uuid}" >/dev/null || true
              done

          command="set -eu; root=/data/video-factory/config; lock=\$root/full-production-smoke.lock; mkdir -p \$root; if ! mkdir \$lock 2>/dev/null; then exit 0; fi; trap 'rmdir \"\$lock\" 2>/dev/null || true' EXIT; if [ -f \$root/full-production-smoke.json ] && grep -Eq '\"ok\"[[:space:]]*:[[:space:]]*true' \$root/full-production-smoke.json; then exit 0; fi; key=\${VIDEO_FACTORY_API_KEY:-\${VIDEO_FACTORY_INTERNAL_API_KEY:-\${ADMIN_SCRIPT_SECRET:-\${ADMIN_PASSWORD:-}}}}; [ -n \"\$key\" ] || exit 0; if ! curl -fsS --max-time 20 -H \"X-API-Key: \$key\" http://127.0.0.1:8080/v1/registry | python3 -c 'import json,sys; d=json.load(sys.stdin); c=next((x for x in d.get(\"contracts\",[]) if x.get(\"id\")==\"abstract-broll-t2v\"),{}); raise SystemExit(0 if d.get(\"comfyui_configured\") and c.get(\"enabled\") and c.get(\"workflow_valid\") else 1)'; then exit 0; fi; curl -fsSL --retry 8 --retry-all-errors https://raw.githubusercontent.com/Paradigmllc/Paradigmjpcom/agent/harden-vast-comfyui-runtime/scripts/ops/run_video_factory_production_smoke.py -o /tmp/run_video_factory_production_smoke.py; chmod 700 /tmp/run_video_factory_production_smoke.py; cd /opt/video-factory; /opt/video-factory/.venv/bin/python /tmp/run_video_factory_production_smoke.py >>\$root/full-production-smoke.log 2>&1"

          jq -n \
            --arg name "${TASK_NAME}" \
            --arg command "${command}" \
            '{name:$name,command:$command,frequency:"* * * * *",timeout:10800,enabled:true}' \
            > /tmp/create-smoke-task.json
          created="$(curl --fail-with-body --silent --show-error --request POST \
            "${auth[@]}" --header "Content-Type: application/json" \
            "${API}/applications/${PARADIGM_APP_UUID}/scheduled-tasks" \
            --data-binary @/tmp/create-smoke-task.json)"
          uuid="$(printf '%s' "${created}" | jq -er '.uuid')"
          echo "task_uuid=${uuid}" >> "${GITHUB_OUTPUT}"

      - name: Wait for delivered production project
        run: |
          set -euo pipefail
          ADMIN_SECRET="$(cat /tmp/paradigm-admin-secret)"
          cookie="$(ADMIN_SECRET="${ADMIN_SECRET}" python3 - <<'PY'
import base64, hashlib, hmac, os, secrets, time
secret = os.environ["ADMIN_SECRET"].encode()
expires = int(time.time()) + 10800
nonce = base64.urlsafe_b64encode(secrets.token_bytes(18)).rstrip(b"=").decode()
payload = f"{expires}.{nonce}"
sig = base64.urlsafe_b64encode(hmac.new(secret, payload.encode(), hashlib.sha256).digest()).rstrip(b"=").decode()
print(f"paradigm_admin_token={payload}.{sig}")
PY
          )"
          echo "::add-mask::${cookie}"

          project_id=""
          for attempt in $(seq 1 360); do
            code="$(curl --silent --show-error --output /tmp/projects.json \
              --write-out '%{http_code}' --max-time 30 \
              --header "Cookie: ${cookie}" \
              'https://www.paradigmjp.com/v1/projects?limit=100' || true)"
            if [ "${code}" = "200" ]; then
              project_id="$(jq -r '.projects[]? | select((.project_name // "") | startswith("system-production-smoke-")) | select(.status == "delivered") | .project_id' /tmp/projects.json | head -n1)"
            fi
            if [ -n "${project_id}" ]; then
              artifacts_code="$(curl --silent --show-error --output /tmp/artifacts.json \
                --write-out '%{http_code}' --max-time 30 \
                --header "Cookie: ${cookie}" \
                "https://www.paradigmjp.com/v1/projects/${project_id}/artifacts" || true)"
              if [ "${artifacts_code}" = "200" ] \
                && jq -e '.artifacts | any((.media_type // "") | startswith("video/"))' /tmp/artifacts.json >/dev/null; then
                break
              fi
              project_id=""
            fi
            if [ $((attempt % 10)) -eq 0 ]; then
              echo "[${attempt}/360] Waiting for full delivered production smoke"
            fi
            sleep 30
          done
          [ -n "${project_id}" ] || { echo "Full production smoke did not reach delivered state" >&2; exit 1; }

          jq -n \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg project_id "${project_id}" \
            --argjson artifacts "$(jq '[.artifacts[]? | select((.media_type // "") | startswith("video/")) | {name,path,size,media_type}]' /tmp/artifacts.json)" \
            '{ok:true,checked_at:$checked_at,project_id:$project_id,state:"delivered",comfyui:true,hyperframes:true,ffmpeg_qa:true,two_gate_flow:true,video_artifacts:$artifacts}' \
            > /tmp/video-factory-production-smoke.json

      - name: Commit production smoke attestation
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${MARKER_PATH}"
          sha="$(curl --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${endpoint}?ref=${MARKER_BRANCH}" | jq -r '.sha // empty')"
          jq -n \
            --arg message "ops: attest full Video Factory production smoke" \
            --arg content "$(base64 -w0 /tmp/video-factory-production-smoke.json)" \
            --arg branch "${MARKER_BRANCH}" \
            --arg sha "${sha}" \
            '{message:$message,content:$content,branch:$branch} + (if $sha == "" then {} else {sha:$sha} end)' \
            > /tmp/smoke-marker-request.json
          curl --fail-with-body --silent --show-error --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${endpoint}" --data-binary @/tmp/smoke-marker-request.json >/dev/null

      - name: Delete one-shot smoke task
        if: always()
        env:
          TASK_UUID: ${{ steps.task.outputs.task_uuid }}
        run: |
          if [ -n "${TASK_UUID:-}" ]; then
            curl --silent --show-error --request DELETE \
              --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              --header "Accept: application/json" \
              "${COOLIFY_API_URL%/}/api/v1/applications/${PARADIGM_APP_UUID}/scheduled-tasks/${TASK_UUID}" >/dev/null || true
          fi
          rm -f /tmp/paradigm-admin-secret /tmp/create-smoke-task.json /tmp/smoke-marker-request.json

      - name: Upload full production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-factory-full-production-smoke
          path: |
            /tmp/video-factory-production-smoke.json
            /tmp/projects.json
            /tmp/artifacts.json
          if-no-files-found: warn
          retention-days: 14
