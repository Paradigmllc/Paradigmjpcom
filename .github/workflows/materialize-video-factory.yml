name: Materialize Video Factory Source

# One-shot source materialization; this file deletes itself after a successful run.
on:
  push:
    branches:
      - main
    paths:
      - bootstrap/video-factory.parts/**
      - bootstrap/video-factory.tar.gz.b64
      - .github/workflows/materialize-video-factory.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: materialize-video-factory-foundation
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify and extract staged source
        shell: bash
        run: |
          set -euo pipefail
          {
            test "$(find bootstrap/video-factory.parts -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 9
            cat bootstrap/video-factory.parts/part-* > /tmp/video-factory.tar.gz.b64
            echo "5495679899220067d29ff512523565d6c98fea8f23cd5e8ae4f617c10b150ded  /tmp/video-factory.tar.gz.b64" | sha256sum --check --strict
            base64 --decode /tmp/video-factory.tar.gz.b64 > /tmp/video-factory.tar.gz
            echo "c7d20da49cfacb462a36dc4ebfefa9fc1e11064e076625cd20217a475a5bcd97  /tmp/video-factory.tar.gz" | sha256sum --check --strict
            python - <<'PY'
          import tarfile
          from pathlib import PurePosixPath

          archive = "/tmp/video-factory.tar.gz"
          with tarfile.open(archive, "r:gz") as handle:
              members = handle.getmembers()
              if not members:
                  raise SystemExit("archive is empty")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"archive links are not allowed: {member.name}")
          PY
            rm -rf services/video-factory
            tar --extract --gzip --file /tmp/video-factory.tar.gz --directory .
            test -f services/video-factory/pyproject.toml
            test -f services/video-factory/src/video_factory/pipeline.py
            test -f .github/workflows/video-factory-ci.yml
          } 2>&1 | tee /tmp/materialize-extract.log

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate materialized factory
        working-directory: services/video-factory
        shell: bash
        run: |
          set -euo pipefail
          {
            sudo apt-get update
            sudo apt-get install -y ffmpeg
            python -m pip install --upgrade pip
            pip install -e '.[dev,api,orchestrator]'
            video-factory export-schemas
            python -m compileall -q src tests
            node --check tools/playwright-capture/capture.mjs
            pytest --cov=video_factory --cov-report=term-missing
            ruff check src tests
            mypy src
            video-factory run examples/briefs/saas-launch.yaml --dry-run --auto-approve
          } 2>&1 | tee /tmp/materialize-validation.log

      - name: Replace staging artifacts with source tree
        shell: bash
        run: |
          set -euo pipefail
          cp -R services/video-factory/workspace /tmp/video-factory-workspace 2>/dev/null || true
          rm -f bootstrap/video-factory.tar.gz.b64
          rm -rf bootstrap/video-factory.parts
          rmdir bootstrap 2>/dev/null || true
          rm -f .github/workflows/materialize-video-factory.yml
          rm -rf services/video-factory/workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "feat: add Paradigm video factory foundation"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 584 --repo "$GITHUB_REPOSITORY" --body "✅ Video Factory source materialized and validated. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue close 584 --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat /tmp/materialize-extract.log 2>/dev/null || true
            cat /tmp/materialize-validation.log 2>/dev/null || true
          } | tail -n 220 > /tmp/materialize-failure-tail.log
          BODY="$(cat /tmp/materialize-failure-tail.log)"
          printf -v COMMENT '❌ Video Factory materialization failed. Run: %s/%s/actions/runs/%s\n\n```text\n%s\n```' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$BODY"
          gh issue comment 584 --repo "$GITHUB_REPOSITORY" --body "$COMMENT"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materialized-video-factory-validation
          path: |
            /tmp/video-factory-workspace
            /tmp/materialize-extract.log
            /tmp/materialize-validation.log
            /tmp/materialize-failure-tail.log
          if-no-files-found: warn
          retention-days: 7
