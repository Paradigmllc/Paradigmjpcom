name: Monitor Vast Production Ready

on:
  pull_request:
    paths:
      - .github/workflows/monitor-vast-production-ready.yml
      - .github/workflows/activate-vast-via-runtime-task.yml
      - scripts/ops/activate_vast_runtime_v2.py
      - scripts/ops/activate_vast_from_runtime.py
      - scripts/vast/provision-video-factory-wan22.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-vast-production-ready
  cancel-in-progress: true

env:
  COOLIFY_API_URL: https://coolify.paradigmjp.com
  PARADIGM_APP_UUID: n8i2sjiqvr2d8hrzppop2m2i
  MARKER_BRANCH: agent/harden-vast-comfyui-runtime
  MARKER_PATH: .ops/vast-production-ready.json

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read production admin signing secret
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            --header "Accept: application/json" \
            --header "User-Agent: Paradigm-Video-Factory-Readiness-Monitor/1.0" \
            "${COOLIFY_API_URL%/}/api/v1/applications/${PARADIGM_APP_UUID}/envs")"
          secret="$(printf '%s' "${response}" | jq -er '
            (.environment_variables // .envs // . // [])
            | map(select((.is_preview // false) == false))
            | map(select(.key == "VIDEO_FACTORY_INTERNAL_API_KEY" or .key == "ADMIN_SCRIPT_SECRET" or .key == "ADMIN_PASSWORD" or .key == "PAYLOAD_SECRET"))
            | sort_by(if .key == "VIDEO_FACTORY_INTERNAL_API_KEY" then 0 elif .key == "ADMIN_SCRIPT_SECRET" then 1 elif .key == "ADMIN_PASSWORD" then 2 else 3 end)
            | .[0]
            | (.real_value // .value // empty)
          ')"
          [ -n "${secret}" ] || { echo "Production admin secret is unavailable" >&2; exit 1; }
          echo "::add-mask::${secret}"
          printf '%s' "${secret}" > /tmp/paradigm-admin-secret
          chmod 600 /tmp/paradigm-admin-secret

      - name: Wait for complete production readiness
        run: |
          set -euo pipefail
          ADMIN_SECRET="$(cat /tmp/paradigm-admin-secret)"
          cookie="$(ADMIN_SECRET="${ADMIN_SECRET}" python3 - <<'PY'
import base64, hashlib, hmac, os, secrets, time
secret = os.environ["ADMIN_SECRET"].encode()
expires = int(time.time()) + 10800
nonce = base64.urlsafe_b64encode(secrets.token_bytes(18)).rstrip(b"=").decode()
payload = f"{expires}.{nonce}"
sig = base64.urlsafe_b64encode(hmac.new(secret, payload.encode(), hashlib.sha256).digest()).rstrip(b"=").decode()
print(f"paradigm_admin_token={payload}.{sig}")
PY
          )"
          echo "::add-mask::${cookie}"

          ready=0
          for attempt in $(seq 1 360); do
            bootstrap_code="$(curl --silent --show-error --output /tmp/bootstrap.json \
              --write-out '%{http_code}' --max-time 30 \
              --header "Cookie: ${cookie}" \
              https://www.paradigmjp.com/v1/console/bootstrap || true)"
            registry_code="$(curl --silent --show-error --output /tmp/registry.json \
              --write-out '%{http_code}' --max-time 30 \
              --header "Cookie: ${cookie}" \
              https://www.paradigmjp.com/v1/registry || true)"
            instances_code="$(curl --silent --show-error --output /tmp/instances.json \
              --write-out '%{http_code}' --max-time 30 \
              --header "Cookie: ${cookie}" \
              https://www.paradigmjp.com/v1/vast/instances || true)"

            runtime_ok=0
            workflow_ok=0
            instance_ok=0
            if [ "${bootstrap_code}" = "200" ] \
              && jq -e '.runtime.comfyui_base_url != null and .runtime.comfyui_api_key_configured == true and .vast.configured == true' /tmp/bootstrap.json >/dev/null 2>&1; then
              runtime_ok=1
            fi
            if [ "${registry_code}" = "200" ] \
              && jq -e '.comfyui_configured == true and (.contracts[]? | select(.id == "abstract-broll-t2v") | .enabled == true and .workflow_valid == true and .file_exists == true)' /tmp/registry.json >/dev/null 2>&1; then
              workflow_ok=1
            fi
            if [ "${instances_code}" = "200" ] \
              && jq -e '.instances | any((.label // .name // "") | startswith("paradigm-comfyui-wan22"))' /tmp/instances.json >/dev/null 2>&1; then
              instance_ok=1
            fi
            if [ "${runtime_ok}" = "1" ] && [ "${workflow_ok}" = "1" ] && [ "${instance_ok}" = "1" ]; then
              ready=1
              break
            fi
            if [ $((attempt % 10)) -eq 0 ]; then
              echo "[${attempt}/360] runtime=${runtime_ok} workflow=${workflow_ok} instance=${instance_ok}"
            fi
            sleep 30
          done
          [ "${ready}" = "1" ] || { echo "Production readiness did not converge" >&2; exit 1; }

          jq -n \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson runtime "$(jq '{comfyui_base_url,comfyui_api_key_configured,vast_api_key_configured}' /tmp/bootstrap.json)" \
            --argjson workflow "$(jq '[.contracts[]? | select(.id == "abstract-broll-t2v") | {id,enabled,workflow_valid,file_exists,workflow_sha256,reviewed_by,reviewed_at}] | .[0]' /tmp/registry.json)" \
            --argjson instance_count "$(jq '[.instances[]? | select((.label // .name // "") | startswith("paradigm-comfyui-wan22"))] | length' /tmp/instances.json)" \
            '{ok:true,checked_at:$checked_at,runtime:$runtime,workflow:$workflow,production_gpu_instances:$instance_count}' \
            > /tmp/vast-production-ready.json

      - name: Commit readiness attestation marker
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${MARKER_PATH}"
          sha="$(curl --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${endpoint}?ref=${MARKER_BRANCH}" | jq -r '.sha // empty')"
          jq -n \
            --arg message "ops: attest Vast production readiness" \
            --arg content "$(base64 -w0 /tmp/vast-production-ready.json)" \
            --arg branch "${MARKER_BRANCH}" \
            --arg sha "${sha}" \
            '{message:$message,content:$content,branch:$branch} + (if $sha == "" then {} else {sha:$sha} end)' \
            > /tmp/marker-request.json
          curl --fail-with-body --silent --show-error --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${endpoint}" --data-binary @/tmp/marker-request.json >/dev/null

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vast-production-readiness
          path: |
            /tmp/vast-production-ready.json
            /tmp/bootstrap.json
            /tmp/registry.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove local secret
        if: always()
        run: rm -f /tmp/paradigm-admin-secret /tmp/marker-request.json
