name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Build Docker image
        run: |
          cat > Dockerfile.ci << 'EOF'
          FROM node:24-alpine
          WORKDIR /app
          ENV NODE_ENV=production
          ENV NEXT_TELEMETRY_DISABLED=1
          COPY .next ./.next
          COPY node_modules ./node_modules
          COPY public ./public
          COPY package.json next.config.ts ./
          COPY .env.example ./.env
          EXPOSE 3000
          CMD ["node_modules/.bin/next", "start"]
          EOF
          docker build -t $REGISTRY/$IMAGE_NAME:latest -f Dockerfile.ci .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push $REGISTRY/$IMAGE_NAME:latest

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker pull $REGISTRY/$IMAGE_NAME:latest
            docker stop paradigm-hp 2>/dev/null || true
            docker rm paradigm-hp 2>/dev/null || true
            docker run -d --name paradigm-hp \
              --network coolify \
              --restart unless-stopped \
              -p 3000:3000 \
              $REGISTRY/$IMAGE_NAME:latest
            sleep 5
            curl -f http://localhost:3000/ja && echo "OK" || echo "FAIL"
