name: Auxiliary Node security

on:
  pull_request:
    paths:
      - "astro-demo/**"
      - "worker/**"
      - ".github/workflows/auxiliary-node-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auxiliary-node-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  astro-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: astro-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro-demo/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  outreach-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
