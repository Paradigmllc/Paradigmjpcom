name: SERICIA recurring operations
on:
  pull_request:
    paths:
      - ".github/workflows/sericia-daily-operations.yml"
      - "src/lib/shopify-ops/**"
      - "src/app/api/shopify-ops/**"
      - "src/components/shopify-ops/**"
      - "supabase/migrations/*sericia*"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec -- vitest run src/lib/shopify-ops src/app/api/shopify-ops
      - run: npm exec -- tsc --noEmit --pretty false
  operate:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        kind: [products, inventory, orders, suppliers, social]
    concurrency:
      group: sericia-daily-${{ matrix.kind }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run due work with durable lock and result
        env:
          WEBHOOK_SECRET: ${{ secrets.TRIGGER_WEBHOOK_SECRET }}
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          test -n "$WEBHOOK_SECRET"
          curl --fail-with-body --silent --show-error --max-time 180 \
            --request POST --header "X-Webhook-Secret: $WEBHOOK_SECRET" \
            --header 'Content-Type: application/json' --data "{\"kind\":\"$KIND\"}" \
            https://paradigmjp.com/api/shopify-ops/daily | tee result.json
          jq -e '.ok == true and .result.state != "failed"' result.json
