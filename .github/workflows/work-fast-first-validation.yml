name: Work evidence-first validation

on:
  pull_request:
    paths:
      - "src/app/api/work/**"
      - "src/components/work/**"
      - "src/lib/sales/manual-japan-entry-batch-contract.test.ts"
      - "src/lib/sales/manual-work-fast-*.ts"
      - "src/lib/sales/manual-work-editorial-*.ts"
      - "src/lib/sales/manual-work-gpt56-*.ts"
      - "src/lib/sales/manual-work-operator-notice.ts"
      - "src/lib/sales/manual-work-recovery-policy*.ts"
      - ".github/workflows/work-fast-first-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: work-evidence-first-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Evidence-first unit and API tests
        run: >-
          npm exec -- vitest run
          src/lib/sales/manual-work-fast-evidence.test.ts
          src/lib/sales/manual-work-fast-qualification.test.ts
          src/lib/sales/manual-work-editorial-brief.test.ts
          src/lib/sales/manual-work-gpt56-writer.test.ts
          src/lib/sales/manual-work-recovery-policy.test.ts
          src/lib/sales/manual-japan-entry-batch-contract.test.ts
          src/app/api/work/batches/route.test.ts
          'src/app/api/work/batches/[batchId]/drain/route.test.ts'
          src/components/work/ManualWorkIntake.test.tsx

      - name: TypeScript
        run: |
          set -o pipefail
          npm exec -- tsc --noEmit 2>&1 | tee /tmp/typescript.log

      - name: Lint changed implementation
        run: |
          set -o pipefail
          npm exec -- eslint \
            'src/app/api/work/batches/route.ts' \
            'src/app/api/work/batches/[batchId]/drain/route.ts' \
            src/components/work/ManualJapanEntryWorkConsole.tsx \
            src/components/work/ManualMessageIntelligence.tsx \
            src/components/work/ManualWorkHistoryItem.tsx \
            src/components/work/ManualWorkIntake.tsx \
            src/lib/sales/manual-work-editorial-brief.ts \
            src/lib/sales/manual-work-editorial-service.ts \
            src/lib/sales/manual-work-gpt56-writer.ts \
            src/lib/sales/manual-work-fast-evidence.ts \
            src/lib/sales/manual-work-fast-qualification.ts \
            src/lib/sales/manual-work-fast-service.ts \
            src/lib/sales/manual-work-operator-notice.ts \
            src/lib/sales/manual-work-recovery-policy.ts \
            --max-warnings=0 \
            2>&1 | tee /tmp/eslint.log

      - name: Production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      - name: Upload validation logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: work-evidence-first-validation-logs
          path: |
            /tmp/typescript.log
            /tmp/eslint.log
            /tmp/build.log
          if-no-files-found: warn
          retention-days: 7
