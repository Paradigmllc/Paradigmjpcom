name: Inspect Vast Activation

# Snapshot trigger: 4 — inspect the per-instance API response and probe ComfyUI securely.
on:
  pull_request:
    paths:
      - .github/workflows/inspect-vast-activation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-vast-activation
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HANDOFF_REF: ops/vast-handoff
    steps:
      - uses: actions/checkout@v4
      - name: Generate one-time handoff key
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/vast-inspect-private.pem
          openssl pkey -in /tmp/vast-inspect-private.pem -pubout -out /tmp/vast-inspect-public.pem
      - name: Upload public key
        uses: actions/upload-artifact@v4
        with:
          name: vast-inspect-public-key-${{ github.run_id }}
          path: /tmp/vast-inspect-public.pem
          retention-days: 1
      - name: Decrypt run-scoped credential
        run: |
          set -euo pipefail
          path=".ops/vast-inspect-${GITHUB_RUN_ID}.ciphertext"
          ref="$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['HANDOFF_REF'], safe=''))
          PY
          )"
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${ref}"
          for attempt in $(seq 1 120); do
            code="$(curl -sS -o /tmp/cipher.json -w '%{http_code}' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "$url" || true)"
            if [ "$code" = 200 ]; then
              jq -r '.content' /tmp/cipher.json | tr -d '\n' | base64 -d | base64 -d > /tmp/cipher.bin
              openssl pkeyutl -decrypt -inkey /tmp/vast-inspect-private.pem \
                -in /tmp/cipher.bin -pkeyopt rsa_padding_mode:oaep \
                -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
                -out /tmp/vast-key
              key="$(tr -d '\r\n' < /tmp/vast-key)"
              echo "::add-mask::$key"
              printf '%s' "$key" > /tmp/vast-key
              chmod 600 /tmp/vast-key
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Capture sanitized Vast and ComfyUI state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          key = Path('/tmp/vast-key').read_text().strip()
          headers = {
              'Authorization': f'Bearer {key}',
              'Accept': 'application/json',
              'User-Agent': 'Mozilla/5.0 ParadigmVideoFactory/1.0',
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          raw = get_json('https://console.vast.ai/api/v1/instances/')
          rows = raw.get('instances', raw.get('results', raw)) if isinstance(raw, dict) else raw
          rows = rows if isinstance(rows, list) else []

          def find_proxy_key(value):
              if isinstance(value, dict):
                  direct = value.get('COMFY_PROXY_KEY')
                  if isinstance(direct, str) and direct:
                      return direct
                  if value.get('key') == 'COMFY_PROXY_KEY' and isinstance(value.get('value'), str):
                      return value['value']
                  for child in value.values():
                      found = find_proxy_key(child)
                      if found:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find_proxy_key(child)
                      if found:
                          return found
              elif isinstance(value, str):
                  for pattern in (
                      r'COMFY_PROXY_KEY[=:]([A-Fa-f0-9]{32,128})',
                      r'COMFY_PROXY_KEY["\']?\s*[:=]\s*["\']([A-Fa-f0-9]{32,128})',
                  ):
                      match = re.search(pattern, value)
                      if match:
                          return match.group(1)
              return None

          def mapped_port(instance):
              ports = instance.get('ports')
              if not isinstance(ports, dict):
                  return None
              value = ports.get('18189/tcp') or ports.get('18189') or ports.get('8189/tcp') or ports.get('8189')
              if isinstance(value, list):
                  value = value[0] if value else None
              if isinstance(value, dict):
                  value = value.get('HostPort') or value.get('host_port') or value.get('port')
              return str(value) if value else None

          sanitized = []
          probe = {'attempted': False, 'proxy_key_discovered': False, 'ready': False}
          detail_meta = {'request_succeeded': False, 'top_level_keys': []}
          for item in rows:
              if not isinstance(item, dict):
                  continue
              sanitized.append({
                  field: item.get(field)
                  for field in (
                      'id', 'label', 'actual_status', 'intended_status', 'status', 'cur_state',
                      'status_msg', 'gpu_name', 'gpu_ram', 'dph_total', 'public_ipaddr',
                      'ports', 'start_date', 'duration', 'image_uuid', 'template_hash_id'
                  )
              })
              if 'paradigm-comfyui-wan22' not in str(item.get('label') or ''):
                  continue
              instance_id = int(item.get('id') or 0)
              detail = None
              if instance_id:
                  try:
                      detail = get_json(f'https://console.vast.ai/api/v0/instances/{instance_id}/')
                      detail_meta = {
                          'request_succeeded': True,
                          'top_level_keys': sorted(detail.keys()) if isinstance(detail, dict) else [],
                      }
                  except Exception as exc:
                      detail_meta = {'request_succeeded': False, 'error': str(exc)[-300:], 'top_level_keys': []}
              proxy_key = find_proxy_key(detail) or find_proxy_key(item)
              port = mapped_port(item)
              host = item.get('public_ipaddr') or item.get('public_ip') or item.get('ssh_host')
              probe['proxy_key_discovered'] = bool(proxy_key)
              if not (proxy_key and port and host):
                  continue
              probe['attempted'] = True
              status_request = urllib.request.Request(
                  f'http://{host}:{port}/__video_factory/status',
                  headers={
                      'Authorization': f'Bearer {proxy_key}',
                      'X-API-Key': proxy_key,
                      'Accept': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(status_request, timeout=20) as response:
                      status = json.load(response)
                  probe.update({
                      'http_status': 200,
                      'ready': status.get('ready') is True,
                      'phase': status.get('phase'),
                      'detail': str(status.get('detail') or '')[-300:],
                      'missing_nodes': status.get('missing_nodes', []),
                      'model_count': len(status.get('models', [])) if isinstance(status.get('models'), list) else None,
                      'workflow_ids': sorted((status.get('workflows') or {}).keys()) if isinstance(status.get('workflows'), dict) else [],
                  })
              except urllib.error.HTTPError as exc:
                  probe.update({'http_status': exc.code, 'error': f'HTTP {exc.code}'})
              except Exception as exc:
                  probe.update({'error': str(exc)[-300:]})

          output = {
              'checked_at': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'instances': sanitized,
              'instance_detail': detail_meta,
              'comfyui_probe': probe,
          }
          Path('/tmp/vast-activation-status.json').write_text(json.dumps(output, indent=2) + '\n')
          print(json.dumps(output, indent=2))
          PY
      - name: Remove key material
        if: always()
        run: shred -u /tmp/vast-key /tmp/vast-inspect-private.pem 2>/dev/null || true
      - name: Upload sanitized status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vast-activation-status
          path: /tmp/vast-activation-status.json
          retention-days: 1
          if-no-files-found: warn
