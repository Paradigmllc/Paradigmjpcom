name: Explain Safe Deployment Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: No automatic or batch deployment cancellation
        run: |
          echo 'This retired workflow does not modify running deployments.'
          echo 'Inspect the exact deployment with node scripts/deploy-status.mjs <deployment_uuid>.'
          echo 'A timeout alone is not authorization to cancel a deployment.'
          echo 'Use npm run release:prod from the approved release environment.'
