name: Fast Probe Two-Service Production

on:
  push:
    branches: [main]
    paths:
      - "src/app/[locale]/video-as-a-service/**"
      - "src/app/[locale]/contact/**"
      - "src/app/api/contact/**"
      - "src/lib/video-service-*.ts"
      - "src/app/sitemap.ts"
      - ".github/workflows/two-service-production-fast-probe.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: two-service-production-fast-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_CONTEXT: production/video-service-probe
      STATUS_TARGET: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish pending production status
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -cn \
              --arg state pending \
              --arg target_url "${STATUS_TARGET}" \
              --arg description 'Checking the live VaaS funnel' \
              --arg context "${STATUS_CONTEXT}" \
              '{state:$state,target_url:$target_url,description:$description,context:$context}')"

      - name: Probe VaaS production pages with deployment retries
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { setTimeout as sleep } from 'node:timers/promises'

          const site = 'https://paradigmjp.com'
          const specs = [
            {
              path: '/ja/video-as-a-service',
              expected: ['動画制作チームを、採用せずに。', '$1,500', '$3,500', '$5,500', '契約前によくある質問'],
            },
            {
              path: '/en/video-as-a-service',
              expected: ['Your on-demand video production team.', '$1,500', '$3,500', '$5,500', 'Questions before you subscribe'],
            },
            {
              path: '/ja/video-as-a-service/terms',
              expected: ['Video as a Service 利用規約', '2026年7月28日', '契約文書の優先順位'],
            },
            {
              path: '/en/video-as-a-service/terms',
              expected: ['Video as a Service Terms', 'July 28, 2026', 'Order of precedence'],
            },
            {
              path: '/ja/contact?intent=video-as-a-service&plan=unlimited',
              expected: ['Video as a Service 申込み', '希望プラン', 'Unlimited', '素材の準備状況'],
            },
            {
              path: '/en/contact?intent=video-as-a-service&plan=unlimited',
              expected: ['Apply for Video as a Service', 'Preferred plan', 'Unlimited', 'Asset readiness'],
            },
            {
              path: '/api/ready',
              expected: [],
            },
          ]

          async function probe(spec) {
            try {
              const url = new URL(spec.path, site)
              url.searchParams.set('production_probe', String(Date.now()))
              const response = await fetch(url, {
                headers: { 'Cache-Control': 'no-cache' },
                redirect: 'follow',
                signal: AbortSignal.timeout(25_000),
              })
              const body = await response.text()
              const missing = spec.expected.filter((value) => !body.includes(value))
              return {
                path: spec.path,
                finalUrl: response.url,
                status: response.status,
                ok: response.ok && missing.length === 0,
                missing,
              }
            } catch (error) {
              return {
                path: spec.path,
                status: 0,
                ok: false,
                missing: [],
                error: error instanceof Error ? error.message : String(error),
              }
            }
          }

          let results = []
          const maxAttempts = 20
          for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
            results = await Promise.all(specs.map(probe))
            const passed = results.filter((result) => result.ok).length
            console.log(`Attempt ${attempt}/${maxAttempts}: ${passed}/${results.length} passed`)
            for (const result of results) {
              const detail = result.error
                ? `error=${result.error}`
                : `missing=${result.missing.length ? result.missing.join(' | ') : 'none'}`
              console.log(`${result.ok ? 'PASS' : 'FAIL'} ${result.path} HTTP ${result.status}; ${detail}`)
            }
            if (results.every((result) => result.ok)) break
            if (attempt < maxAttempts) await sleep(15_000)
          }

          const lines = results.map((result) => {
            const detail = result.error
              ? `error=${result.error}`
              : `missing=${result.missing.length ? result.missing.join(' | ') : 'none'}`
            return `${result.ok ? '✅' : '❌'} ${result.path} — HTTP ${result.status}; ${detail}`
          })
          fs.writeFileSync('/tmp/two-service-fast-probe.md', `${lines.join('\n')}\n`)
          fs.writeFileSync('/tmp/two-service-fast-probe.json', `${JSON.stringify(results, null, 2)}\n`)

          if (!results.every((result) => result.ok)) process.exitCode = 1
          NODE

      - name: Publish successful production status
        if: success()
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -cn \
              --arg state success \
              --arg target_url "${STATUS_TARGET}" \
              --arg description 'Live VaaS pages, terms, forms, and readiness passed' \
              --arg context "${STATUS_CONTEXT}" \
              '{state:$state,target_url:$target_url,description:$description,context:$context}')"

      - name: Publish failed production status
        if: failure()
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -cn \
              --arg state failure \
              --arg target_url "${STATUS_TARGET}" \
              --arg description 'One or more live VaaS checks failed' \
              --arg context "${STATUS_CONTEXT}" \
              '{state:$state,target_url:$target_url,description:$description,context:$context}')"

      - name: Add production verification summary
        if: always()
        run: |
          {
            echo '## Video as a Service production probe'
            echo
            cat /tmp/two-service-fast-probe.md 2>/dev/null || echo 'Probe did not produce results.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-service-production-probe
          path: |
            /tmp/two-service-fast-probe.md
            /tmp/two-service-fast-probe.json
          if-no-files-found: error
          retention-days: 14
