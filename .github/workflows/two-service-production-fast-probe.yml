name: Fast Probe Two-Service Production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/two-service-production-fast-probe.yml

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Probe all public pages in parallel
        id: probe
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const site = 'https://paradigmjp.com'
          const specs = [
            { path: '/en', expected: ['Japan Market Partner', 'Video as a Service'] },
            { path: '/ja', expected: ['Video as a Service', 'Web制作', 'AI制作・導入支援'] },
            { path: '/en/japan-market-partner', expected: ['Japan Market Partner', 'Japan Market Setup', '$13,000'] },
            { path: '/en/video-as-a-service', expected: ['Video as a Service', 'One active request'] },
            { path: '/ja/video-as-a-service', expected: ['Video as a Service', '一件ずつ制作'] },
          ]

          const results = await Promise.all(specs.map(async (spec) => {
            try {
              const response = await fetch(`${site}${spec.path}?fast_probe=${Date.now()}`, {
                headers: { 'Cache-Control': 'no-cache' },
                signal: AbortSignal.timeout(25_000),
              })
              const html = await response.text()
              const missing = spec.expected.filter((value) => !html.includes(value))
              return { path: spec.path, status: response.status, ok: response.ok && missing.length === 0, missing }
            } catch (error) {
              return { path: spec.path, status: 0, ok: false, missing: [], error: error instanceof Error ? error.message : String(error) }
            }
          }))

          const lines = results.map((result) => {
            const detail = result.error ? `error=${result.error}` : `missing=${result.missing.length ? result.missing.join(' | ') : 'none'}`
            return `${result.ok ? '✅' : '❌'} ${result.path} — HTTP ${result.status}; ${detail}`
          })
          const allPassed = results.every((result) => result.ok)
          fs.writeFileSync('/tmp/two-service-fast-probe.md', `${lines.join('\n')}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `passed=${allPassed}\n`)
          if (!allPassed) process.exitCode = 1
          NODE

      - name: Report success and close release issue
        if: success()
        run: |
          BODY="$(cat /tmp/two-service-fast-probe.md)"
          gh issue comment 569 --repo "$GITHUB_REPOSITORY" --body "✅ **Production release verified**\n\n${BODY}\nAll refreshed public pages are live."
          gh issue close 569 --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Report exact failure
        if: failure()
        run: |
          BODY="$(cat /tmp/two-service-fast-probe.md 2>/dev/null || echo 'Probe did not produce results.')"
          gh issue comment 569 --repo "$GITHUB_REPOSITORY" --body "❌ **Fast production probe failed**\n\n${BODY}"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-service-fast-probe
          path: /tmp/two-service-fast-probe.md
          if-no-files-found: warn
          retention-days: 7
