name: One-shot Country Partner Release Proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-release-observer.yml

permissions:
  contents: write
  issues: write

jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record production proof
        run: |
          set -euo pipefail
          gh issue comment 570 --repo "$GITHUB_REPOSITORY" --body "Task.md proof run started: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python <<'PY'
          from pathlib import Path
          task = Path('Task.md')
          current = task.read_text(encoding='utf-8')
          marker = '## CURRENT STATUS - 2026-07-28 Japan Country Partner本番反映完了'
          if marker not in current:
              proof = '''## CURRENT STATUS - 2026-07-28 Japan Country Partner本番反映完了

- PR **#565** を `main` へ統合し、英語サイトの主軸を **Your Japan Country Partner**、初期有料契約を **Japan Market Setup**、主CTAを **Apply for a Japan Partnership — $13K**、公開キャパシティ表記を **Limited founding-partner capacity** へ変更した。セットアップ費 **$13,000**、14営業日納品保証、選定パートナー向け6か月運用条件は維持し、未定義の売上20%は公開していない。
- 関連Vitest **34件**、TypeScript、production build、Quality Guard **0 errors / 84 existing warnings**を通過。Coolify deployment **bm4w5btityiz1814a8bh8xf7** は `finished`。固定Traefikルートが旧Docker IPを向いたため一時502になったが、旧IP解放後の制御された再デプロイサイクルで公開ルートを復旧した。
- 最終検証 **GitHub Actions run 30311462742** でホームページCMS seed **HTTP 200**、`/en` **HTTP 200**、新4文言すべてPASS、旧heroなし、`/api/ready` **HTTP 200**、認証済み`/api/sales/health` **HTTP 200 / ok:true / status:degraded**をread-backした。`degraded`はerrorではなく、任意サービスの未設定を含む状態。
- 緊急復旧専用のone-shot GitHub Actionsは証跡記録後に削除し、通常のデプロイ入口へ残さない。Issue **#566 / #568 / #570** はクリーンアップ完了後に閉じる。

'''
              task.write_text(proof + current, encoding='utf-8')
          PY
          if git diff --quiet -- Task.md; then
            gh issue comment 570 --repo "$GITHUB_REPOSITORY" --body 'Task.md already contains the production proof.'
            exit 0
          fi
          git add Task.md
          git commit -m 'docs: record Country Partner production release'
          set +e
          OUTPUT="$(git push origin HEAD:main 2>&1)"
          CODE=$?
          set -e
          if [ "$CODE" -eq 0 ]; then
            gh issue comment 570 --repo "$GITHUB_REPOSITORY" --body '✅ Task.md production proof committed and pushed to main.'
          else
            printf -v BODY '❌ Task.md push failed.\n\n```text\n%s\n```' "$OUTPUT"
            gh issue comment 570 --repo "$GITHUB_REPOSITORY" --body "$BODY"
            exit "$CODE"
          fi
