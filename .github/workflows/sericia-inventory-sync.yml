name: SERICIA BASE inventory sync

on:
  pull_request:
    paths:
      - ".github/workflows/sericia-inventory-sync.yml"
      - "src/app/api/shopify-ops/base/**"
      - "src/components/shopify-ops/ShopifyBaseSyncPanel.tsx"
      - "src/lib/shopify-ops/base-*.ts"
      - "src/lib/shopify-ops/types.ts"
  schedule:
    # Every 30 minutes. The API applies only safe diffs and records blocked irregularities.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sericia-base-inventory-sync
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused inventory automation tests
        run: >-
          npm exec -- vitest run
          src/lib/shopify-ops/base-sync.test.ts
          src/lib/shopify-ops/base-sync-automation.test.ts
          src/app/api/shopify-ops/base/daily/route.test.ts
      - name: TypeScript
        run: npm exec -- tsc --noEmit --pretty false
      - name: Lint inventory automation
        run: >-
          npm exec -- eslint
          src/lib/shopify-ops/base-sync-service.ts
          src/lib/shopify-ops/base-sync-automation.ts
          src/lib/shopify-ops/base-sync-automation.test.ts
          src/app/api/shopify-ops/base/daily/route.ts
          src/app/api/shopify-ops/base/daily/route.test.ts
          src/components/shopify-ops/ShopifyBaseSyncPanel.tsx
          --max-warnings=0
      - name: Production build
        run: npm run build

  run:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Synchronize safe BASE catalog and inventory diffs
        env:
          WEBHOOK_SECRET: ${{ secrets.TRIGGER_WEBHOOK_SECRET }}
        run: |
          test -n "$WEBHOOK_SECRET"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "X-Webhook-Secret: $WEBHOOK_SECRET" \
            --header "Content-Type: application/json" \
            https://paradigmjp.com/api/shopify-ops/base/daily
