name: Video Factory CI

on:
  pull_request:
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - services/video-factory/**
      - src/app/admin/video-factory/**
      - src/app/api/video-factory/**
      - src/app/console/**
      - src/app/v1/**
      - src/lib/video-factory-internal-proxy.ts
      - "src/app/[locale]/admin/video-growth/**"
      - src/app/api/sales/video-growth/**
      - src/components/video-growth/**
      - src/lib/video-growth/**
      - e2e/video-growth.spec.ts
      - supabase/migrations/20260802132000_video_growth_direct_acquisition.sql
      - supabase/migrations/2026080219*_video_growth_commercial_*.sql
      - scripts/release-doctor.mjs
      - scripts/sales-os-no-login-deploy.mjs
      - scripts/verify-db-tables.mjs
      - .agents/skills/paradigm-video-producer/**
      - .codex/config.toml
      - .github/workflows/video-factory-ci.yml
      - .github/workflows/video-factory-deploy.yml
      - scripts/ops/ensure-video-factory-storage.sh
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - services/video-factory/**
      - src/app/admin/video-factory/**
      - src/app/api/video-factory/**
      - src/app/console/**
      - src/app/v1/**
      - src/lib/video-factory-internal-proxy.ts
      - "src/app/[locale]/admin/video-growth/**"
      - src/app/api/sales/video-growth/**
      - src/components/video-growth/**
      - src/lib/video-growth/**
      - e2e/video-growth.spec.ts
      - supabase/migrations/20260802132000_video_growth_direct_acquisition.sql
      - supabase/migrations/2026080219*_video_growth_commercial_*.sql
      - scripts/release-doctor.mjs
      - scripts/sales-os-no-login-deploy.mjs
      - scripts/verify-db-tables.mjs
      - .agents/skills/paradigm-video-producer/**
      - .codex/config.toml
      - .github/workflows/video-factory-ci.yml
      - .github/workflows/video-factory-deploy.yml
      - scripts/ops/ensure-video-factory-storage.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Direct-growth unit and API tests
        run: >-
          npm exec -- vitest run
          src/lib/video-growth/workflow.test.ts
          src/lib/video-growth/export.test.ts
          src/app/api/sales/video-growth/route.test.ts
          --pool=threads
          --maxWorkers=1
      - name: TypeScript
        run: npm exec -- tsc --noEmit
      - name: Lint direct-growth implementation
        run: >-
          npm exec -- eslint
          'src/app/[locale]/admin/video-growth/page.tsx'
          'src/app/[locale]/admin/video-growth/loading.tsx'
          'src/app/[locale]/admin/video-growth/error.tsx'
          src/app/api/sales/video-growth/route.ts
          src/components/admin/BeforeDashboard.tsx
          src/components/video-growth
          src/lib/sales/db-tables.ts
          src/lib/video-growth
          scripts/release-doctor.mjs
          scripts/sales-os-no-login-deploy.mjs
          scripts/verify-db-tables.mjs
          --max-warnings=0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/video-factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e '.[dev,api,orchestrator]'
      - name: Static, GUI, embedded-runtime, and schema validation
        run: |
          video-factory export-schemas
          python -m compileall -q src tests
          python -c 'from video_factory.web import app; assert app.title == "Paradigm Video Factory"'
          node --check tools/playwright-capture/capture.mjs
          node --check src/video_factory/static/console.js
          node --check src/video_factory/static/console-run-poll.js
          node --check src/video_factory/static/console-studio.js
          node --check src/video_factory/static/console-vast-connect.js
          node --check src/video_factory/static/console-upload.js
          grep -q "CLIを使わず" src/video_factory/static/console.html
          sh -n ../../docker-entrypoint.sh
          bash -n ../../scripts/ops/ensure-video-factory-storage.sh
          grep -q 'video_factory.web:app' ../../docker-entrypoint.sh
          grep -q 'services/video-factory' ../../Dockerfile
          ruff check src tests
          mypy src
      - name: Unit tests
        run: pytest --cov=video_factory --cov-report=term-missing
      - name: Compose validation
        run: cp .env.example .env && docker compose -f compose.yml config --quiet
      - name: Registry and readiness reports
        run: |
          video-factory workflows list
          video-factory workflows models
          video-factory doctor
      - name: Full two-gate dry-run production
        run: video-factory run examples/briefs/saas-launch.yaml --dry-run --auto-approve
      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-factory-dry-run
          path: services/video-factory/workspace
          if-no-files-found: warn
          retention-days: 7

  production-container:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Build the exact production container
        run: docker build --progress=plain --tag paradigm-video-factory-pr .
      - name: Verify embedded runtime contents
        run: |
          docker run --rm --entrypoint /bin/sh paradigm-video-factory-pr -c '
            test -x /usr/local/bin/paradigm-entrypoint &&
            test -x /opt/video-factory/.venv/bin/uvicorn &&
            command -v hyperframes &&
            command -v ffmpeg &&
            command -v chromium-browser &&
            test "$(node --version)" = "v22.23.1" &&
            test "$(python3 --version)" = "Python 3.13.14" &&
            chromium-browser --version &&
            cp -R /opt/video-factory/examples/hyperframes-smoke /tmp/hyperframes-smoke &&
            chown -R nextjs:nodejs /tmp/hyperframes-smoke &&
            su-exec nextjs:nodejs env HOME=/home/nextjs hyperframes check /tmp/hyperframes-smoke --json &&
            su-exec nextjs:nodejs env HOME=/home/nextjs hyperframes render /tmp/hyperframes-smoke --output /tmp/hyperframes-smoke/out.mp4 --quality draft --no-browser-gpu &&
            test -s /tmp/hyperframes-smoke/out.mp4 &&
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 /tmp/hyperframes-smoke/out.mp4 &&
            python3 --version
          '
