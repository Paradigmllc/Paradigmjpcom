name: Emergency Paradigm Traefik Repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-traefik-repair.yml
      - scripts/ops/repair-production-traefik.mjs
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: paradigmjp-emergency-traefik-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_API_URL: https://coolify.paradigmjp.com
      PARADIGM_APP_UUID: n8i2sjiqvr2d8hrzppop2m2i
      PARADIGM_REPAIR_VERIFY: "0"
      GH_TOKEN: ${{ github.token }}
      STATUS_CONTEXT: repair/traefik-paradigmjp
      STATUS_TARGET: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish repair pending status
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -cn --arg state pending --arg target_url "${STATUS_TARGET}" --arg description 'Repairing the active Paradigm Traefik upstream' --arg context "${STATUS_CONTEXT}" '{state:$state,target_url:$target_url,description:$description,context:$context}')"
      - name: Repair the current production upstream
        run: node scripts/ops/repair-production-traefik.mjs
      - name: Confirm the public origin is reachable
        run: |
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/ready.json --write-out '%{http_code}' --max-time 20 https://www.paradigmjp.com/api/ready || true)"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            echo "[$attempt/30] public readiness HTTP $code"
            sleep 5
          done
          exit 1
      - name: Publish repair success status
        if: success()
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -cn --arg state success --arg target_url "${STATUS_TARGET}" --arg description 'Active Paradigm Traefik upstream repaired' --arg context "${STATUS_CONTEXT}" '{state:$state,target_url:$target_url,description:$description,context:$context}')"
      - name: Publish repair failure status
        if: failure()
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -cn --arg state failure --arg target_url "${STATUS_TARGET}" --arg description 'Paradigm Traefik upstream repair failed' --arg context "${STATUS_CONTEXT}" '{state:$state,target_url:$target_url,description:$description,context:$context}')"
