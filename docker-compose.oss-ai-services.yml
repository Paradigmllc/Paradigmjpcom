# OSS AI & Browser Automation Services
# Steel-Browser: Headless browser API for scraping/screenshots (Apache 2.0)
# FlareSolverr: Cloudflare/WAF bypass proxy for search (MIT)
# MassDNS: Ultra-fast passive DNS CNAME scanner (GPLv3, 100k+ domains/sec)

services:
  steel-browser:
    image: ghcr.io/steel-dev/steel-browser:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:9223:9223"
    environment:
      - CHROME_EXECUTABLE_PATH=/usr/bin/google-chrome
    volumes:
      - steel-browser-data:/app/data

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8191:8191"
    environment:
      - LOG_LEVEL=info

  massdns:
    build:
      context: .
      dockerfile: docker/Dockerfile.massdns
    restart: "no"
    cap_add:
      - NET_RAW
    volumes:
      - massdns-data:/data

volumes:
  steel-browser-data:
  massdns-data:
