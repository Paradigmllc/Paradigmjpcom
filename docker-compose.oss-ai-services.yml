# SearXNG — Meta search engine for Sales OS
# Deploy: Coolify → Docker Compose Service

services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - searxng-data:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-paradigm-searxng-key}
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

volumes:
  searxng-data:
