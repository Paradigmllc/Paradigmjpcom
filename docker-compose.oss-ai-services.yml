# Morphic + Perplexica + Skyvern — AI-powered OSS search & automation
# Deploy via Coolify to paradigmjp.com subdomains.
# Secrets stored in Coolify env, never committed to git.

services:
  # ─── Morphic: AI-powered search engine ──────────────────────
  morphic:
    image: ghcr.io/miurla/morphic:latest
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${MORPHIC_OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${MORPHIC_OPENAI_API_BASE:-https://api.openai.com/v1}
      - SEARCH_API_KEY=${MORPHIC_SEARCH_API_KEY:-}
      - SEARCH_API_BASE=${MORPHIC_SEARCH_API_BASE:-}
      - UPSTASH_REDIS_REST_URL=${MORPHIC_REDIS_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${MORPHIC_REDIS_TOKEN:-}
      - NEXT_PUBLIC_APP_URL=${MORPHIC_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "${MORPHIC_PORT:-3002}:3000"
    networks:
      - ai-services

  # ─── Perplexica: AI-powered search (Perplexity OSS) ─────────
  perplexica-backend:
    image: ghcr.io/itzcrazykns/perplexica-backend:latest
    restart: unless-stopped
    depends_on:
      perplexica-searxng:
        condition: service_healthy
    environment:
      - SEARXNG_API_URL=http://perplexica-searxng:8080
      - OPENAI_API_KEY=${PERPLEXICA_OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${PERPLEXICA_OPENAI_API_BASE:-https://api.openai.com/v1}
      - OLLAMA_API_BASE=${PERPLEXICA_OLLAMA_API_BASE:-http://perplexica-ollama:11434}
      - GROQ_API_KEY=${PERPLEXICA_GROQ_API_KEY:-}
      - ANTHROPIC_API_KEY=${PERPLEXICA_ANTHROPIC_API_KEY:-}
      - PORT=3001
    ports:
      - "${PERPLEXICA_BACKEND_PORT:-3003}:3001"
    networks:
      - ai-services

  perplexica-frontend:
    image: ghcr.io/itzcrazykns/perplexica-frontend:latest
    restart: unless-stopped
    depends_on:
      - perplexica-backend
    environment:
      - NEXT_PUBLIC_API_URL=http://perplexica-backend:3001
      - NEXT_PUBLIC_WS_URL=ws://perplexica-backend:3001
      - NEXT_PUBLIC_APP_URL=${PERPLEXICA_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "${PERPLEXICA_FRONTEND_PORT:-3004}:3000"
    networks:
      - ai-services

  perplexica-searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - perplexica-searxng-data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${PERPLEXICA_SEARXNG_SECRET:-perplexica-secret-key}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "${PERPLEXICA_SEARXNG_PORT:-8081}:8080"
    networks:
      - ai-services

  # ─── Skyvern: Browser automation with AI agents ─────────────
  skyvern:
    image: ghcr.io/skyvern-ai/skyvern:latest
    restart: unless-stopped
    environment:
      - SKYVERN_BASE_URL=${SKYVERN_PUBLIC_URL:-http://localhost:8000}
      - OPENAI_API_KEY=${SKYVERN_OPENAI_API_KEY:-}
      - DATABASE_STRING=postgresql+asyncpg://${SKYVERN_POSTGRES_USER:-skyvern}:${SKYVERN_POSTGRES_PASSWORD:-skyvern}@skyvern-postgres:5432/${SKYVERN_POSTGRES_DB:-skyvern}
      - REDIS_HOST=skyvern-redis
      - REDIS_PORT=6379
      - BROWSER_TYPE=${SKYVERN_BROWSER_TYPE:-chromium-headless}
      - MAX_WORKERS=${SKYVERN_MAX_WORKERS:-4}
      - LOG_LEVEL=${SKYVERN_LOG_LEVEL:-INFO}
    ports:
      - "${SKYVERN_PORT:-8000}:8000"
    depends_on:
      skyvern-postgres:
        condition: service_healthy
      skyvern-redis:
        condition: service_started
    networks:
      - ai-services

  skyvern-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${SKYVERN_POSTGRES_USER:-skyvern}
      - POSTGRES_PASSWORD=${SKYVERN_POSTGRES_PASSWORD:-skyvern}
      - POSTGRES_DB=${SKYVERN_POSTGRES_DB:-skyvern}
    volumes:
      - skyvern-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SKYVERN_POSTGRES_USER:-skyvern}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-services

  skyvern-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - ai-services

networks:
  ai-services:
    driver: bridge

volumes:
  perplexica-searxng-data:
  skyvern-pg-data:
