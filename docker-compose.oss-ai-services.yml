# Morphic + Perplexica + Skyvern — AI-powered OSS search & automation
# LLM: DeepSeek V4 (OpenAI-compatible) via api.deepseek.com
# Deploy: Coolify → Docker Compose Service

x-deepseek-env: &deepseek-env
  OPENAI_API_KEY: ${DEEPSEEK_API_KEY:-sk-placeholder-set-in-coolify}
  OPENAI_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}

services:
  # ─── Morphic: AI-powered search engine ──────────────────────
  morphic:
    image: ghcr.io/miurla/morphic:2.0.0
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      <<: *deepseek-env
      SEARCH_API_KEY: ${MORPHIC_SEARCH_API_KEY:-}
      SEARCH_API_BASE: ${MORPHIC_SEARCH_API_BASE:-http://perplexica-searxng:8080}
      UPSTASH_REDIS_REST_URL: ${MORPHIC_REDIS_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${MORPHIC_REDIS_TOKEN:-}
      NEXT_PUBLIC_APP_URL: https://morphic.paradigmjp.com
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    networks:
      - ai-services

  # ─── Perplexica: AI-powered search ─────────────────────────
  perplexica-backend:
    image: ghcr.io/itzcrazykns/perplexica-backend:2.7.3
    restart: unless-stopped
    depends_on:
      perplexica-searxng:
        condition: service_healthy
    environment:
      <<: *deepseek-env
      SEARXNG_API_URL: http://perplexica-searxng:8080
      OLLAMA_API_BASE: ${PERPLEXICA_OLLAMA_API_BASE:-}
      GROQ_API_KEY: ${PERPLEXICA_GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${PERPLEXICA_ANTHROPIC_API_KEY:-}
      PORT: "3001"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    ports:
      - "3003:3001"
    networks:
      - ai-services

  perplexica-frontend:
    image: ghcr.io/itzcrazykns/perplexica-frontend:2.7.3
    restart: unless-stopped
    depends_on:
      - perplexica-backend
    environment:
      NEXT_PUBLIC_API_URL: http://perplexica-backend:3001
      NEXT_PUBLIC_WS_URL: ws://perplexica-backend:3001
      NEXT_PUBLIC_APP_URL: https://perplexica.paradigmjp.com
    ports:
      - "3004:3000"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - ai-services

  perplexica-searxng:
    image: searxng/searxng:2025.5.13-65197a4d9
    restart: unless-stopped
    volumes:
      - perplexica-searxng-data:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET: ${PERPLEXICA_SEARXNG_SECRET:-paradigm-searxng-perplexica-key}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8081:8080"
    networks:
      - ai-services

  # ─── Skyvern: Browser automation with AI agents ─────────────
  skyvern:
    image: ghcr.io/skyvern-ai/skyvern:1.1.0
    restart: unless-stopped
    environment:
      <<: *deepseek-env
      SKYVERN_BASE_URL: https://skyvern.paradigmjp.com
      DATABASE_STRING: postgresql+asyncpg://${SKYVERN_POSTGRES_USER:-skyvern}:${SKYVERN_POSTGRES_PASSWORD:-skyvern}@skyvern-postgres:5432/${SKYVERN_POSTGRES_DB:-skyvern}
      REDIS_HOST: skyvern-redis
      REDIS_PORT: "6379"
      BROWSER_TYPE: chromium-headless
      MAX_WORKERS: "4"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "2.0"
    depends_on:
      skyvern-postgres:
        condition: service_healthy
      skyvern-redis:
        condition: service_started
    networks:
      - ai-services

  skyvern-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SKYVERN_POSTGRES_USER:-skyvern}
      POSTGRES_PASSWORD: ${SKYVERN_POSTGRES_PASSWORD:-skyvern}
      POSTGRES_DB: ${SKYVERN_POSTGRES_DB:-skyvern}
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    volumes:
      - skyvern-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SKYVERN_POSTGRES_USER:-skyvern}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-services

  skyvern-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - ai-services

networks:
  ai-services:
    driver: bridge

volumes:
  perplexica-searxng-data:
  skyvern-pg-data:
