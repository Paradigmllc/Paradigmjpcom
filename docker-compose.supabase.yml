# Supabase OSS template for paradigmjp.com.
# Do not commit real passwords, JWT secrets, anon keys, or service-role keys.
# The current production stack is managed on the server and uses PostgreSQL,
# PostgREST, Studio, and Postgres Meta. Treat this file as a safe template for
# a future full-stack rebuild after secrets are generated and backed up.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SUPABASE_POSTGRES_USER:?SUPABASE_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${SUPABASE_POSTGRES_PASSWORD:?SUPABASE_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${SUPABASE_POSTGRES_DB:-postgres}
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - max_slot_wal_keep_size=1024
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  rest:
    image: postgrest/postgrest:v14.8
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://${SUPABASE_POSTGRES_USER:?SUPABASE_POSTGRES_USER is required}:${SUPABASE_POSTGRES_PASSWORD:?SUPABASE_POSTGRES_PASSWORD is required}@db:5432/${SUPABASE_POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE:-anon}
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET is required}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      db:
        condition: service_healthy

  realtime:
    image: supabase/realtime:v2.102.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer $${SUPABASE_ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${SUPABASE_POSTGRES_PASSWORD:?SUPABASE_POSTGRES_PASSWORD is required}
      DB_NAME: ${SUPABASE_POSTGRES_DB:-postgres}
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${SUPABASE_REALTIME_DB_ENC_KEY:?SUPABASE_REALTIME_DB_ENC_KEY is required}
      API_JWT_SECRET: ${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET is required}
      ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
      SECRET_KEY_BASE: ${SUPABASE_REALTIME_SECRET_KEY_BASE:?SUPABASE_REALTIME_SECRET_KEY_BASE is required}
      METRICS_JWT_SECRET: ${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET is required}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  meta:
    image: supabase/postgres-meta:v0.96.3
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${SUPABASE_POSTGRES_DB:-postgres}
      PG_META_DB_USER: ${SUPABASE_POSTGRES_USER:?SUPABASE_POSTGRES_USER is required}
      PG_META_DB_PASSWORD: ${SUPABASE_POSTGRES_PASSWORD:?SUPABASE_POSTGRES_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy

  studio:
    image: supabase/studio:2026.04.27-sha-5f60601
    restart: unless-stopped
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${SUPABASE_POSTGRES_PASSWORD:?SUPABASE_POSTGRES_PASSWORD is required}
      SUPABASE_URL: ${SUPABASE_PUBLIC_URL:?SUPABASE_PUBLIC_URL is required}
      DEFAULT_ORGANIZATION_NAME: ${SUPABASE_STUDIO_ORG:-Paradigm}
      DEFAULT_PROJECT_NAME: ${SUPABASE_STUDIO_PROJECT:-paradigm-os}
    depends_on:
      db:
        condition: service_healthy
      meta:
        condition: service_started

volumes:
  supabase-db-data:
