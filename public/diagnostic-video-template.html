<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Paradigm Diagnostic Video</title>
<style>
  :root {
    --bg: #080b12;
    --accent: #7c5cff;
    --text: #ffffff;
    --muted: rgba(255,255,255,0.6);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; overflow:hidden; width:1920px; height:1080px; }
  [data-composition-id="paradigm-diagnostic"] { width:1920px; height:1080px; position:relative; }
</style>
</head>
<body>
<div data-composition-id="paradigm-diagnostic" data-width="1920" data-height="1080" data-duration="60">

  <!-- Grain overlay for film texture -->
  <div data-component="grain-overlay" data-opacity="0.15"></div>
  
  <!-- Vignette for cinematic focus -->
  <div data-component="vignette" data-intensity="0.4"></div>

  <!-- Scene 1: Hook (0-9s) -->
  <div data-scene="hook" data-start="0" data-duration="9">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 160px;text-align:center">
      <div data-component="morph-text" data-words="{{company_name}},{{industry}},Paradigm" data-interval="1500" style="font-size:64px;font-weight:800;color:var(--accent);margin-bottom:32px"></div>
      <div style="font-size:28px;line-height:1.4;color:var(--muted);max-width:1000px">{{hook}}</div>
      <div data-component="shimmer-sweep" style="margin-top:40px;font-size:20px;color:var(--accent);opacity:0.7">{{label}}</div>
    </div>
  </div>

  <!-- Scene 2: Pain + Data (9-22s) -->
  <div data-scene="pain" data-start="9" data-duration="13">
    <div style="position:absolute;inset:0;display:flex;align-items:center;padding:0 120px;gap:80px">
      <div style="flex:1">
        <div data-component="caption-highlight" style="font-size:48px;font-weight:800;line-height:1.1;margin-bottom:24px">{{pain_headline}}</div>
        <div style="font-size:22px;line-height:1.5;color:var(--muted)">{{pain_body}}</div>
      </div>
      <div style="width:400px">
        <div data-component="data-chart" data-values="{{metric_value}},{{industry_avg}}" data-labels="御社,業界平均" data-color="#ef4444,#22c55e" style="height:300px"></div>
      </div>
    </div>
  </div>

  <!-- Scene 3: Fear + Captions (22-36s) -->
  <div data-scene="fear" data-start="22" data-duration="14">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 160px;text-align:center">
      <div data-component="caption-editorial-emphasis" style="font-size:52px;font-weight:800;line-height:1.2;max-width:1200px;margin-bottom:32px">{{fear_headline}}</div>
      <div style="font-size:24px;line-height:1.5;color:var(--muted);max-width:900px">{{fear_body}}</div>
      <div style="margin-top:40px;font-size:36px;font-weight:800;color:#ef4444">{{loss_value}}</div>
    </div>
  </div>

  <!-- Scene 4: Solution + Hope (36-48s) -->
  <div data-scene="hope" data-start="36" data-duration="12">
    <div style="position:absolute;inset:0;display:flex;align-items:center;padding:0 120px;gap:60px">
      <div style="flex:1">
        <div style="font-size:18px;font-weight:800;color:#22c55e;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:16px">{{solution_label}}</div>
        <div style="font-size:44px;font-weight:800;line-height:1.2;margin-bottom:24px">{{hope_headline}}</div>
        <div style="font-size:20px;line-height:1.5;color:var(--muted)">{{hope_body}}</div>
      </div>
    </div>
  </div>

  <!-- Scene 5: CTA (48-60s) -->
  <div data-scene="cta" data-start="48" data-duration="12">
    <div data-component="grid-pixelate-wipe" data-direction="out"></div>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 160px">
      <div data-component="shimmer-sweep" style="font-size:56px;font-weight:800;line-height:1.2;max-width:1100px;margin-bottom:24px">{{cta_headline}}</div>
      <div style="font-size:22px;color:var(--muted);margin-bottom:40px">{{cta_body}}</div>
      <div style="font-size:28px;font-weight:800;color:var(--accent)">{{report_url}}</div>
    </div>
  </div>

  <!-- Logo outro -->
  <div data-scene="outro" data-start="58" data-duration="2">
    <div data-component="logo-outro" data-text="Paradigm"></div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</body>
</html>
