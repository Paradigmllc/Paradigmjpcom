<svg width="900" height="560" viewBox="0 0 900 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="560" rx="28" fill="#111827"/>
  <text x="64" y="78" fill="#FDE68A" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">APPLICATION / OPERATING PATH</text>
  <text x="64" y="122" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="700">A clear decision path after you apply.</text>
  <text x="64" y="154" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16">The application is reviewed by an operator—not accepted by an automation.</text>
  <path d="M128 286H772" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif">
    <circle cx="160" cy="286" r="27" fill="#34D399"/><text x="160" y="295" text-anchor="middle" fill="#052E16" font-size="18" font-weight="700">01</text><text x="160" y="352" text-anchor="middle" fill="white" font-size="17" font-weight="700">FIT REVIEW</text><text x="160" y="378" text-anchor="middle" fill="#94A3B8" font-size="13">Authority, offer, timing</text>
    <circle cx="450" cy="286" r="27" fill="#60A5FA"/><text x="450" y="295" text-anchor="middle" fill="#172554" font-size="18" font-weight="700">02</text><text x="450" y="352" text-anchor="middle" fill="white" font-size="17" font-weight="700">SCOPE CONFIRMATION</text><text x="450" y="378" text-anchor="middle" fill="#94A3B8" font-size="13">Inputs, exclusions, dependencies</text>
    <circle cx="740" cy="286" r="27" fill="#FBBF24"/><text x="740" y="295" text-anchor="middle" fill="#451A03" font-size="18" font-weight="700">03</text><text x="740" y="352" text-anchor="middle" fill="white" font-size="17" font-weight="700">START DECISION</text><text x="740" y="378" text-anchor="middle" fill="#94A3B8" font-size="13">Terms, date, accountable owner</text>
  </g>
  <rect x="64" y="442" width="772" height="52" rx="13" fill="white" fill-opacity=".07" stroke="white" stroke-opacity=".12"/>
  <text x="90" y="474" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="14">Submission is a fit review. A contract starts only after scope and start date are agreed.</text>
</svg>
