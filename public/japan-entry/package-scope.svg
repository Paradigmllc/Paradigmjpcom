  <text x="98" y="292" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="12">six months included · then $995/mo</text>
  <g font-family="Arial, sans-serif">
    <rect x="356" y="198" width="220" height="74" rx="14" fill="#EFF6FF"/><text x="380" y="228" fill="#1E3A8A" font-size="14" font-weight="700">01  BUYER PATH</text><text x="380" y="250" fill="#475569" font-size="12">Offer, trust, next action</text>
    <rect x="604" y="198" width="220" height="74" rx="14" fill="#ECFDF5"/><text x="628" y="228" fill="#065F46" font-size="14" font-weight="700">02  TRUST</text><text x="628" y="250" fill="#475569" font-size="12">Terms, privacy, ownership</text>
