# Stagehand — AI browser automation (OSS)
# Uses Playwright + LLM for intelligent web interaction
# Deploy: Coolify → Docker Compose Service

services:
  stagehand:
    image: browserbase/stagehand:latest
    restart: unless-stopped
    environment:
      - STAGEHAND_API_KEY=${STAGEHAND_API_KEY:-stagehand-local-key}
      - STAGEHAND_MODEL=${STAGEHAND_MODEL:-deepseek-chat}
      - STAGEHAND_LLM_API_KEY=${DEEPSEEK_API_KEY:-}
      - STAGEHAND_LLM_BASE_URL=${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
      - HEADLESS=true
    ports:
      - "3100:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    volumes:
      - stagehand-data:/app/data

volumes:
  stagehand-data:
