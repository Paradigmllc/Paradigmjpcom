# OSINT Microservices — Production Compose (Coolify compatible)
# Python API servers in docker/osint/ mounted as volumes
# Deploy: Coolify → Docker Compose Service

services:
  # ─── SpiderFoot API ────────────────────────────────────────
  spiderfoot:
    image: python:3.13-alpine
    restart: unless-stopped
    command: >
      sh -c "pip install -q spiderfoot flask && python3 /app/server.py"
    volumes:
      - ./docker/osint/spiderfoot-server.py:/app/server.py:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - osint-net

  # ─── Katana API ────────────────────────────────────────────
  katana:
    image: projectdiscovery/katana:1.2.3
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache python3 py3-flask curl &&
        python3 /app/server.py
    volumes:
      - ./docker/osint/katana-server.py:/app/server.py:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    networks:
      - osint-net

  # ─── Maigret API ───────────────────────────────────────────
  maigret:
    image: python:3.13-alpine
    restart: unless-stopped
    command: >
      sh -c "pip install -q maigret flask && python3 /app/server.py"
    volumes:
      - ./docker/osint/maigret-server.py:/app/server.py:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    networks:
      - osint-net


networks:
  osint-net:
    driver: bridge
