[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paradigm-video-factory"
version = "0.1.0"
description = "Rights-aware, multi-engine video production orchestration for Paradigm VaaS"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Paradigm LLC" }]
dependencies = [
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]
orchestrator = ["prefect>=3,<4"]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
video-factory = "video_factory.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_factory = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# Prefect's dynamic decorator overloads and provider JSON boundaries do not
# expose stable strict types. Keep strict checking for the console, Vast.ai,
# registry, review, security, and media code while isolating those boundaries.
[[tool.mypy.overrides]]
module = "video_factory.orchestration"
disable_error_code = ["assignment", "no-any-return"]

[[tool.mypy.overrides]]
module = "video_factory.pipeline"
disable_error_code = ["arg-type", "var-annotated"]

[[tool.mypy.overrides]]
module = "video_factory.api"
disable_error_code = ["misc", "arg-type"]

[[tool.mypy.overrides]]
module = "video_factory.cli"
disable_error_code = ["var-annotated", "arg-type"]

[[tool.mypy.overrides]]
module = "video_factory.doctor"
disable_error_code = ["arg-type", "unused-ignore", "attr-defined"]

[[tool.mypy.overrides]]
module = ["video_factory.frameio", "video_factory.settings"]
disable_error_code = ["no-any-return"]

[tool.coverage.run]
source = ["video_factory"]
branch = true
