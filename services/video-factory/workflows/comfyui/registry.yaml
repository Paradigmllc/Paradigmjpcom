    media_kind: video
    approval: approved_contract
    enabled: false
    risk: standard
    required_nodes: [LoadVideo, approved-frame-interpolation-node, SaveVideo]
    required_models: [approved-interpolation-model]
    required_rights: [source_assets_cleared]

