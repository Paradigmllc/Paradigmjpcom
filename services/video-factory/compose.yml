name: paradigm-video-factory

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prefect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prefect}
      POSTGRES_DB: ${POSTGRES_DB:-prefect}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prefect} -d ${POSTGRES_DB:-prefect}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - prefect-postgres:/var/lib/postgresql/data

  prefect-server:
    image: prefecthq/prefect:3-latest
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: "postgresql+asyncpg://${POSTGRES_USER:-prefect}:\
        ${POSTGRES_PASSWORD:-prefect}@postgres:5432/${POSTGRES_DB:-prefect}"
      PREFECT_SERVER_API_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4200:4200"

  prefect-deployer:
    build:
      context: .
      args:
        HYPERFRAMES_VERSION: ${HYPERFRAMES_VERSION:-0.7.77}
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      for attempt in $$(seq 1 30); do
        prefect work-pool create video-factory --type process --overwrite && break;
        if [ "$$attempt" -eq 30 ]; then exit 1; fi;
        sleep 2;
      done;
      prefect deploy --all
    env_file: .env
    environment:
      VIDEO_FACTORY_WORKSPACE: /data/video-factory
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      - factory-workspace:/data/video-factory
      - ./prefect.yaml:/app/prefect.yaml:ro
      - ./src:/app/src:ro
      - ./config:/app/config:ro
    depends_on:
      prefect-server:
        condition: service_started

  comfyui-auth-proxy:
    build:
      context: .
      args:
        HYPERFRAMES_VERSION: ${HYPERFRAMES_VERSION:-0.7.77}
    profiles: ["gpu"]
    restart: unless-stopped
    entrypoint: ["video-factory"]
    env_file: .env
    command: ["comfy-proxy", "--host", "0.0.0.0", "--port", "8189"]
    expose:
      - "8189"

  factory-api:
    build:
      context: .
      args:
        HYPERFRAMES_VERSION: ${HYPERFRAMES_VERSION:-0.7.77}
    restart: unless-stopped
    env_file: .env
    environment:
      VIDEO_FACTORY_WORKSPACE: /data/video-factory
      PREFECT_API_URL: http://prefect-server:4200/api
    command: ["--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - factory-workspace:/data/video-factory
      - ./workflows:/app/workflows:ro
      - ./config:/app/config:ro
      - ./licenses:/app/licenses:ro
    ports:
      - "8080:8080"
    depends_on:
      prefect-deployer:
        condition: service_completed_successfully

  prefect-worker:
    build:
      context: .
      args:
        HYPERFRAMES_VERSION: ${HYPERFRAMES_VERSION:-0.7.77}
    restart: unless-stopped
    entrypoint: ["prefect"]
    command:
      - worker
      - start
      - --pool
      - video-factory
      - --type
      - process
      - --with-healthcheck
    env_file: .env
    environment:
      VIDEO_FACTORY_WORKSPACE: /data/video-factory
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      - factory-workspace:/data/video-factory
      - ./workflows:/app/workflows:ro
      - ./config:/app/config:ro
      - ./licenses:/app/licenses:ro
    depends_on:
      prefect-deployer:
        condition: service_completed_successfully

volumes:
  prefect-postgres:
  factory-workspace:
