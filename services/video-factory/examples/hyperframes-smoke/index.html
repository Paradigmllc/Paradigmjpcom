<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=320, height=180" />
  <title>HyperFrames runtime smoke</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1020; }
    #stage { position: relative; width: 320px; height: 180px; overflow: hidden; }
    #runtime-card { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font: 700 28px/1.1 sans-serif; animation: enter 800ms ease-out both; }
    @keyframes enter {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="stage" data-composition-id="runtime-smoke" data-no-timeline data-start="0" data-duration="1" data-width="320" data-height="180" data-fps="24">
    <section id="runtime-card" class="clip" data-start="0" data-duration="1" data-track-index="0">Runtime ready</section>
  </div>
</body>
</html>
