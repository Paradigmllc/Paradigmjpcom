<div class="captions" data-layout-allow-caption-zone=""><p id="groundwater-sub-1" class="subtitle clip" data-start="0.8" data-duration="11.008833" data-track-index="3">ここからは、見えない地面の下を見てみましょう。地下水という言葉から、地下の大きな川を想像するかもしれません。でも、多くの場合、その姿は少し違います。</p>
<p id="groundwater-sub-2" class="subtitle clip" data-start="12.508833" data-duration="11.577750" data-track-index="3">土や岩を拡大すると、粒と粒の間にすき間があります。地下の水の多くは、こうしたすき間や岩の割れ目にあります。スポンジに含まれた水を思い浮かべると、近いイメージです。</p>
<p id="groundwater-sub-3" class="subtitle clip" data-start="24.786583" data-duration="11.357000" data-track-index="3">地面にしみ込んだ水は、重力や圧力の違いによって移動します。下向きだけでなく、横へ向かう流れもあります。どこへ進みやすいかは、地層の性質によって変わります。</p>
<p id="groundwater-sub-4" class="subtitle clip" data-start="36.843583" data-duration="12.332375" data-track-index="3">大切なのは、水の旅に決まった速さがないことです。水を通しやすい場所と、通しにくい場所では、移動にかかる時間が違います。この図の動く速さは、実際の速度ではありません。</p>
<p id="groundwater-sub-5" class="subtitle clip" data-start="49.875958" data-duration="12.111833" data-track-index="3">地下水の一部は、やがて川や泉へ出てきます。晴れた日にも川の水が流れ続ける理由のひとつは、この見えないつながりです。ただし、川から地下へ水が移る場所もあります。</p>
<p id="groundwater-sub-6" class="subtitle clip" data-start="62.687792" data-duration="12.135042" data-track-index="3">海と空だけでなく、土や岩も水の旅の舞台です。表面から見えなくなった水も、なくなったわけではありません。姿と場所、そして時間を変えながら、循環に関わっています。</p></div>
