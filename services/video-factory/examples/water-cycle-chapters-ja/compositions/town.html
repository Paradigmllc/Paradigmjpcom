</svg></div><p id="note" class="note">03 / 03　同じ雨を、二つの地面で比べる</p>
<div class="captions" data-layout-allow-caption-zone=""><p id="town-sub-1" class="subtitle clip" data-start="0.8" data-duration="12.169792" data-track-index="3">最後に、同じ雨が街に降ったらどうなるか、考えてみましょう。左は草や土のある地面。右は、道路や建物に覆われた地面です。雨の降り方は同じとして比べます。</p>
<p id="town-sub-2" class="subtitle clip" data-start="13.669792" data-duration="12.518042" data-track-index="3">土のある場所では、水の一部が地面にしみ込みます。植物が利用する水もあれば、さらに下へ進む水もあります。すべての雨がしみ込むわけではなく、地表を流れる水もあります。</p>
<p id="town-sub-3" class="subtitle clip" data-start="26.887833" data-duration="12.471708" data-track-index="3">道路や屋根のように水を通しにくい面では、地中へしみ込みにくくなります。その分、表面を流れ、排水路や川へ向かう水が増えやすくなります。土地の使い方が、水の道を変えるのです。</p>
<p id="town-sub-4" class="subtitle clip" data-start="40.059542" data-duration="12.587833" data-track-index="3">とはいえ、草地ならいつでも安心、という意味ではありません。雨の強さや、土がすでにどれくらい湿っているかによって、流れ方は変わります。地域の条件を無視して、図だけで判断はできません。</p>
<p id="town-sub-5" class="subtitle clip" data-start="53.347375" data-duration="12.146500" data-track-index="3">この比較は仕組みを説明する模式図です。矢印の太さや粒の数は、雨量の割合を示していません。実際に水を管理するときは、その土地の観測や詳しい調査が必要です。</p>
<p id="town-sub-6" class="subtitle clip" data-start="66.193875" data-duration="12.541333" data-track-index="3">次に雨を見たら、空から落ちる瞬間だけでなく、その前と後を想像してみてください。雲になるまで、地面に届いてから。私たちの街も、大きな水の循環の中にあります。</p></div>
