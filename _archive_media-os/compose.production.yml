name: youtube-media-os

x-media-os-environment: &media-os-environment
  NODE_ENV: production
  MEDIA_OS_DATABASE_PATH: /data/media-os.sqlite
  MEDIA_OS_STUDIO_ENABLED: "true"
  MEDIA_OS_WORKER_RENDERERS: research_ingest,narration,editorial_blueprint,entertainment_pilot,comfyui_hyperframes,hyperframes,professional_master
  MEDIA_OS_VOICE_PYTHON: /opt/voice-runtime/bin/python
  XDG_CACHE_HOME: /app/.cache
  MEDIA_OS_WHISPER_CACHE: /app/.cache/faster-whisper
  MEDIA_OS_WHISPER_MODELS: small,small.en
  CRAWL4AI_API_URL: http://crawl4ai:11235/
  CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?CRAWL4AI_API_TOKEN is required}

services:
  crawl4ai:
    image: unclecode/crawl4ai:0.8.9
    restart: unless-stopped
    shm_size: 1gb
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?CRAWL4AI_API_TOKEN is required}
      CRAWL4AI_HOOKS_ENABLED: "false"
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11235/health',timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 15
      start_period: 45s

  studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: youtube-media-os:${MEDIA_OS_RELEASE_FINGERPRINT:-latest}
    restart: unless-stopped
    env_file:
      - .env.production
    environment: *media-os-environment
    volumes:
      - media-os-data:/data
      - media-os-renders:/app/renders
      - media-os-models:/app/.cache
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(e=>{console.error(e);process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.middlewares.youtube-media-os-gzip.compress: "true"
      traefik.http.middlewares.youtube-media-os-https.redirectscheme.scheme: https
      traefik.http.routers.youtube-media-os-http.entrypoints: http
      traefik.http.routers.youtube-media-os-http.middlewares: youtube-media-os-https
      traefik.http.routers.youtube-media-os-http.rule: Host(`${MEDIA_OS_HOSTNAME}`)
      traefik.http.routers.youtube-media-os-http.service: youtube-media-os
      traefik.http.routers.youtube-media-os-https.entrypoints: https
      traefik.http.routers.youtube-media-os-https.middlewares: youtube-media-os-gzip
      traefik.http.routers.youtube-media-os-https.rule: Host(`${MEDIA_OS_HOSTNAME}`)
      traefik.http.routers.youtube-media-os-https.service: youtube-media-os
      traefik.http.routers.youtube-media-os-https.tls: "true"
      traefik.http.routers.youtube-media-os-https.tls.certresolver: letsencrypt
      traefik.http.services.youtube-media-os.loadbalancer.server.port: "3000"

  voice-bootstrap:
    image: youtube-media-os:${MEDIA_OS_RELEASE_FINGERPRINT:-latest}
    restart: "no"
    command: ["node", "scripts/bootstrap-production-voice-models.mjs"]
    env_file:
      - .env.production
    environment: *media-os-environment
    volumes:
      - media-os-models:/app/.cache
    networks:
      - coolify
    init: true

  worker:
    image: youtube-media-os:${MEDIA_OS_RELEASE_FINGERPRINT:-latest}
    restart: unless-stopped
    depends_on:
      crawl4ai:
        condition: service_healthy
      studio:
        condition: service_healthy
      voice-bootstrap:
        condition: service_completed_successfully
    command: ["node", "scripts/run-production-queue.mjs", "--watch", "--poll-seconds", "5"]
    env_file:
      - .env.production
    environment: *media-os-environment
    volumes:
      - media-os-data:/data
      - media-os-renders:/app/renders
      - media-os-models:/app/.cache
    networks:
      - coolify
    init: true

volumes:
  media-os-data:
  media-os-renders:
  media-os-models:

networks:
  coolify:
    external: true
